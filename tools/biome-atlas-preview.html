<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crônicas das Eras — laboratório de biomas</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#102421;color:#f6e9c8;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
aside{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);padding:12px 16px;background:#102922ed;border:1px solid #b89c67;border-radius:0 0 12px 0;pointer-events:none}
h1{font-size:16px;margin:0 0 4px}p{margin:0;font-size:12px;color:#d7c69d}
#status{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;background:#102922e8;padding:7px 10px;border-radius:8px;pointer-events:none}
#stopUnit{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(225px + env(safe-area-inset-bottom));z-index:2;background:#51352e;border:1px solid #d4a187;border-radius:8px;color:#fff0df;padding:10px;min-height:44px;font:600 12px system-ui,sans-serif}#stopUnit:disabled{opacity:.5}#queueMode{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(175px + env(safe-area-inset-bottom));z-index:2;background:#193b30;border:1px solid #c6ab74;border-radius:8px;color:#f6e9c8;padding:10px;min-height:44px;font:600 12px system-ui,sans-serif}#queueMode[aria-pressed="true"]{background:#87662e;color:white}#minimap{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:150px;height:150px;max-width:28vw;max-height:28vw;border:2px solid #c6ab74;border-radius:9px;background:#142b28;touch-action:none;box-shadow:0 4px 18px #0009;cursor:crosshair}
@media(max-width:600px){aside{padding:8px 10px;max-width:70vw}h1{font-size:14px}#status{font-size:11px;max-width:52vw}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Prévia isométrica dos quatro biomas"></canvas>
<aside><h1>Laboratório de biomas</h1><p>Mapa 64 × 64 · selecione tropa azul, toque no destino · botão Fila para múltiplas ordens</p></aside>
<div id="status" role="status">Carregando atlas…</div>
<button id="stopUnit" type="button" disabled aria-label="Parar tropa selecionada">Parar tropa</button>
<button id="queueMode" type="button" aria-pressed="false" aria-label="Alternar fila de ordens de movimento">Fila: desligada</button>
<canvas id="minimap" width="150" height="150" tabindex="0" role="button" aria-label="Minimapa navegável: setas movem a câmera; Enter centraliza o mapa"></canvas>
<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const status=document.getElementById('status'),atlas=new Image();
const minimap=document.getElementById('minimap'),miniCtx=minimap.getContext('2d');
let width=0,height=0,scale=1,offsetX=0,offsetY=0,ready=false,atlasLoaded=false;
const SIZE=64,tiles=[];
// Settlements and patrols are deterministic and share the terrain depth pass.
const structures=[{x:21,y:22,type:'hall'},{x:24,y:22,type:'house'},{x:20,y:25,type:'house'},{x:26,y:24,type:'tower'},{x:43,y:37,type:'hall'},{x:46,y:38,type:'tower'},{x:42,y:40,type:'house'}];
const troops=Array.from({length:16},(_,i)=>({x:19+(i%8)*1.25,y:28+Math.floor(i/8)*1.4,team:0})).concat(Array.from({length:12},(_,i)=>({x:40+(i%6)*1.3,y:43+Math.floor(i/6)*1.5,team:1})));
let animationStart=performance.now();
function hash(x,y){let v=Math.imul(x+37,374761393)+Math.imul(y+19,668265263);v=Math.imul(v^(v>>>13),1274126177);return (v^(v>>>16)>>>0)/4294967296}
for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
 // Low-frequency, deterministic climate bands make contiguous regions instead of a checkerboard.
 const latitude=y/SIZE,longitude=x/SIZE;
 const moisture=hash(Math.floor(x/12),Math.floor(y/12))*.55+
                hash(Math.floor(x/6),Math.floor(y/6))*.30+hash(x,y)*.15;
 const temperature=.72-latitude*.62+Math.sin(longitude*Math.PI*2)*.18;
 const biome=temperature<.29?3:temperature>.65&&moisture<.43?2:moisture>.54?1:0;
 tiles.push({x,y,biome});
}
// Render back-to-front: tall trees must not be painted over nearer terrain.
tiles.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x);
// Keep render objects linked to live troop coordinates instead of detached copies.
for(const v of structures)v.kind='building';
for(const v of troops)v.kind='troop';
const objects=[...structures,...troops];
// Keep troop positions mutable: their depth order changes as patrols move.
const patrolOrigins=troops.map(o=>({x:o.x,y:o.y}));
let selectedTroop=-1;
const stopButton=document.getElementById('stopUnit');
function syncStopButton(){stopButton.disabled=selectedTroop<0;}
let queueEnabled=false;
const queueButton=document.getElementById('queueMode');
queueButton.addEventListener('click',()=>{queueEnabled=!queueEnabled;queueButton.setAttribute('aria-pressed',String(queueEnabled));queueButton.textContent=queueEnabled?'Fila: ligada':'Fila: desligada';status.textContent=queueEnabled?'Próximos destinos serão adicionados à fila':'Próxima ordem substituirá a rota atual';});
const orders=new Map();
// Once a player stops or moves a unit, it stays at its commanded position.
const holdingPosition=new Set();
let lastSimulationSeconds=null;
function worldAt(sx,sy){
 const a=(sx-width/2-offsetX)/scale/112,b=(sy-height/2-offsetY)/scale/56+SIZE;
 return {x:(a+b)/2,y:(b-a)/2};
}
// Grid A*: buildings are impassable; diagonal corner-cutting is forbidden.
const blocked=new Set(structures.flatMap(b=>{
 const cells=[];for(let y=Math.floor(b.y)-1;y<=Math.floor(b.y)+1;y++)
 for(let x=Math.floor(b.x)-1;x<=Math.floor(b.x)+1;x++)cells.push(y*SIZE+x);
 return cells;
}));
function findPath(start,target){
 const cell=(p)=>({x:Math.max(0,Math.min(SIZE-1,Math.floor(p.x))),y:Math.max(0,Math.min(SIZE-1,Math.floor(p.y)))});
 const a=cell(start),b=cell(target),key=(x,y)=>y*SIZE+x;
 const valid=(x,y)=>x>=0&&y>=0&&x<SIZE&&y<SIZE&&!blocked.has(key(x,y));
 // Units can start inside a building footprint after a patrol or map edit.
 // Find a walkable origin rather than letting A* escape through blocked corners.
 if(!valid(a.x,a.y)){
  let nearest=null;
  for(let radius=1;radius<SIZE&&!nearest;radius++){
   for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==radius)continue;
    const x=a.x+dx,y=a.y+dy;
    if(valid(x,y)&&(!nearest||Math.hypot(x-start.x,y-start.y)<nearest.distance))
     nearest={x,y,distance:Math.hypot(x-start.x,y-start.y)};
   }
  }
  if(!nearest)return null;
  a.x=nearest.x;a.y=nearest.y;
 }
 // Find the closest traversable destination when a building occupies the tap.
 // Never silently walk through a building to reach an invalid final waypoint.
 let goalCell=b;
 if(!valid(b.x,b.y)){
  let found=null;
  for(let radius=1;radius<SIZE&&!found;radius++){
   const candidates=[];
   for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==radius)continue;
    const x=b.x+dx,y=b.y+dy;
    if(valid(x,y))candidates.push({x,y,distance:Math.hypot(x+.5-target.x,y+.5-target.y)});
   }
   candidates.sort((p,q)=>p.distance-q.distance);
   if(candidates.length)found=candidates[0];
  }
  if(!found)return null;
  goalCell=found;
 }
 const startKey=key(a.x,a.y),goal=key(goalCell.x,goalCell.y),open=[startKey],came=new Map(),cost=new Map([[startKey,0]]),score=new Map([[startKey,Math.hypot(a.x-goalCell.x,a.y-goalCell.y)]]);
 const closed=new Set();
 while(open.length){
  let best=0;for(let i=1;i<open.length;i++)if(score.get(open[i])<score.get(open[best]))best=i;
  const current=open.splice(best,1)[0];
  if(current===goal){
   const route=[];let k=current;
   while(k!==startKey){route.push({x:k%SIZE+.5,y:Math.floor(k/SIZE)+.5});k=came.get(k);if(k===undefined)return null;}
   route.reverse();
   // Exact pointer destination is safe only when its cell is traversable.
   // The fallback remains at the center of the closest walkable tile.
   if(goalCell.x===b.x&&goalCell.y===b.y)route.push({x:target.x,y:target.y});
   return route;
  }
  closed.add(current);
  const x=current%SIZE,y=Math.floor(current/SIZE);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   if(!dx&&!dy)continue;
   const nx=x+dx,ny=y+dy,nk=key(nx,ny);
   if(!valid(nx,ny)||closed.has(nk)||(dx&&dy&&(!valid(x+dx,y)||!valid(x,y+dy))))continue;
   const next=cost.get(current)+(dx&&dy?Math.SQRT2:1);
   if(next>=(cost.get(nk)??Infinity))continue;
   came.set(nk,current);cost.set(nk,next);score.set(nk,next+Math.hypot(nx-goalCell.x,ny-goalCell.y));
   if(!open.includes(nk))open.push(nk);
  }
 }
 return null;
}
function issueOrder(sx,sy){
 const p=worldAt(sx,sy);
 const nearest=troops.reduce((best,o,i)=>{
  if(o.team!==0)return best;
  const screenX=width/2+offsetX+(o.x-o.y)*112*scale;
  const screenY=height/2+offsetY+(o.x+o.y-SIZE)*56*scale-13*scale;
  const dist=Math.hypot(screenX-sx,screenY-sy);
  return dist<best.dist?{i,dist}:best;
 },{i:-1,dist:Infinity});
 if(nearest.i>=0&&nearest.dist<Math.max(22,24*scale)){
  selectedTroop=nearest.i;syncStopButton();
  status.textContent='Unidade '+(selectedTroop+1)+' selecionada · toque no destino';
  draw();
  return;
 }
 if(selectedTroop<0)return;
 const target={x:Math.max(0,Math.min(SIZE-1,p.x)),y:Math.max(0,Math.min(SIZE-1,p.y))};
 enqueueMove(target,queueEnabled);
}

// Stop immediately, discard queued waypoints and make the current position the new idle anchor.
function stopSelectedTroop(){
 if(selectedTroop<0)return;
 const unit=troops[selectedTroop];
 orders.delete(selectedTroop);
 holdingPosition.add(selectedTroop);
 patrolOrigins[selectedTroop]={x:unit.x,y:unit.y};
 status.textContent='Unidade '+(selectedTroop+1)+' parada · rota cancelada';
 draw();
}
stopButton.addEventListener('click',stopSelectedTroop);
function enqueueMove(target,append){
 if(selectedTroop<0)return;
 const previous=append?orders.get(selectedTroop):null;
 const origin=previous&&previous.route.length?previous.route[previous.route.length-1]:troops[selectedTroop];
 const route=findPath(origin,target);
 if(!route){status.textContent='Destino bloqueado ou sem caminho';return;}
 holdingPosition.add(selectedTroop);
 if(previous){previous.route=previous.route.slice(previous.index);previous.index=0;previous.route.push(...route);status.textContent='Fila atualizada · '+previous.route.length+' pontos restantes';}
 else{orders.set(selectedTroop,{route,index:0});status.textContent='Rota calculada · '+route.length+' pontos';}
 draw();
}
function updatePatrols(seconds){
 const dt=lastSimulationSeconds===null?0:Math.max(0,Math.min(.15,seconds-lastSimulationSeconds));
 lastSimulationSeconds=seconds;
 troops.forEach((o,i)=>{
  const origin=patrolOrigins[i],phase=seconds*.32+i*.71;
  const order=orders.get(i);
  if(order){
   let remaining=1.35*dt;
   while(remaining>0&&order.index<order.route.length){
    const waypoint=order.route[order.index],dx=waypoint.x-o.x,dy=waypoint.y-o.y,dist=Math.hypot(dx,dy);
    if(dist<.001){order.index++;continue;}
    const step=Math.min(dist,remaining);o.x+=dx/dist*step;o.y+=dy/dist*step;remaining-=step;
    if(step>=dist-.001)order.index++;
   }
   if(order.index>=order.route.length){orders.delete(i);patrolOrigins[i]={x:o.x,y:o.y};}
  }else if(i!==selectedTroop&&!holdingPosition.has(i)){
   o.x=origin.x+Math.cos(phase)*1.15;
   o.y=origin.y+Math.sin(phase)*.8;
  }
 });
 objects.sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x);
}
// Cache static terrain and structures once; only units and viewport change per frame.
const minimapTerrain=document.createElement('canvas');
minimapTerrain.width=minimapTerrain.height=150;
const terrainCtx=minimapTerrain.getContext('2d');
const minimapCell=150/SIZE;
const minimapColors=['#719457','#315f47','#c5a36b','#dce6e6'];
for(const t of tiles){
 terrainCtx.fillStyle=minimapColors[t.biome];
 terrainCtx.fillRect(t.x*minimapCell,t.y*minimapCell,minimapCell+.5,minimapCell+.5);
}
for(const o of structures){
 terrainCtx.fillStyle='#f8d786';
 terrainCtx.fillRect(o.x*minimapCell-2,o.y*minimapCell-2,5,5);
}
function renderMinimap(){
 const m=150,cell=minimapCell;
 miniCtx.clearRect(0,0,m,m);
 miniCtx.drawImage(minimapTerrain,0,0);
 // Draw queued waypoints on the minimap to make long RTS orders readable on phones.
 const activeOrder=orders.get(selectedTroop);
 if(activeOrder&&selectedTroop>=0){
  const unit=troops[selectedTroop];
  miniCtx.save();
  miniCtx.strokeStyle='#ffe49c';miniCtx.lineWidth=1.5;
  miniCtx.setLineDash([3,3]);miniCtx.beginPath();
  miniCtx.moveTo(unit.x*cell,unit.y*cell);
  for(let i=activeOrder.index;i<activeOrder.route.length;i++){
   const p=activeOrder.route[i];miniCtx.lineTo(p.x*cell,p.y*cell);
  }
  miniCtx.stroke();miniCtx.setLineDash([]);
  const destination=activeOrder.route[activeOrder.route.length-1];
  if(destination){miniCtx.fillStyle='#ffe49c';miniCtx.beginPath();miniCtx.arc(destination.x*cell,destination.y*cell,3,0,Math.PI*2);miniCtx.fill();}
  miniCtx.restore();
 }
 for(let i=0;i<troops.length;i++){
  const o=troops[i];
  miniCtx.fillStyle=o.team?'#d95549':'#5ab2f2';
  miniCtx.fillRect(o.x*cell-1,o.y*cell-1,3,3);
  if(i===selectedTroop){
   miniCtx.strokeStyle='#ffe49c';miniCtx.lineWidth=1.5;
   miniCtx.beginPath();miniCtx.arc(o.x*cell+.5,o.y*cell+.5,4.5,0,Math.PI*2);miniCtx.stroke();
  }
 }
 // Inverse isometric projection of the four viewport corners.
 miniCtx.beginPath();
 const corners=[[0,0],[width,0],[width,height],[0,height]];
 corners.forEach(([sx,sy],i)=>{
  const a=(sx-width/2-offsetX)/scale/112,b=(sy-height/2-offsetY)/scale/56+SIZE;
  const mx=(a+b)/2*cell,my=(b-a)/2*cell;
  if(i===0)miniCtx.moveTo(mx,my);else miniCtx.lineTo(mx,my);
 });
 miniCtx.closePath();miniCtx.strokeStyle='#fff6d5';miniCtx.lineWidth=1.5;miniCtx.stroke();
}
function resize(){
 // Keep the 150-unit minimap coordinate system while rendering sharply on Retina displays.
 // CSS controls its visual size; backing pixels track DPR independently of scene resolution.
 const miniDpr=Math.min(window.devicePixelRatio||1,3);
 const miniPixels=Math.round(150*miniDpr);
 if(minimap.width!==miniPixels||minimap.height!==miniPixels){
  minimap.width=miniPixels;minimap.height=miniPixels;
 }
 miniCtx.setTransform(miniDpr,0,0,miniDpr,0,0);
 const dpr=Math.min(devicePixelRatio||1,2,Math.sqrt(3500000/Math.max(1,innerWidth*innerHeight)));
 width=innerWidth;height=innerHeight;
 canvas.width=Math.max(1,Math.round(width*dpr));canvas.height=Math.max(1,Math.round(height*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
function draw(){
 ctx.clearRect(0,0,width,height);
 ctx.fillStyle='#102421';ctx.fillRect(0,0,width,height);
 if(!ready)return;
 ctx.save();ctx.translate(width/2+offsetX,height/2+offsetY);ctx.scale(scale,scale);
 const now=(performance.now()-animationStart)*.001;
 let oi=0;
 function renderObject(o){
  const px=(o.x-o.y)*112,py=(o.x+o.y-SIZE)*56;
  if(Math.abs(px*scale+width/2+offsetX)>width+160||Math.abs(py*scale+height/2+offsetY)>height+160)return;
  ctx.save();ctx.translate(px,py);
  if(o.kind==='building'){
   const hall=o.type==='hall',tower=o.type==='tower',w=hall?55:tower?22:33,h=hall?44:tower?69:27;
   ctx.fillStyle='#15262288';ctx.beginPath();ctx.ellipse(4,8,w*.7,15,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#a89168';ctx.beginPath();ctx.moveTo(-w,0);ctx.lineTo(0,w*.36);ctx.lineTo(0,-h+w*.36);ctx.lineTo(-w,-h);ctx.closePath();ctx.fill();
   ctx.fillStyle='#715c48';ctx.beginPath();ctx.moveTo(0,w*.36);ctx.lineTo(w,0);ctx.lineTo(w,-h);ctx.lineTo(0,-h+w*.36);ctx.closePath();ctx.fill();
   ctx.fillStyle=tower?'#7b8791':'#874c3c';ctx.beginPath();ctx.moveTo(-w-7,-h);ctx.lineTo(0,-h-w*.45);ctx.lineTo(w+7,-h);ctx.lineTo(0,-h+w*.3);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#d8c69a';ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle='#302e2a';ctx.fillRect(w*.34,-h*.53,9,12);
   if(hall){ctx.fillStyle='#e4bb68';ctx.fillRect(-5,-h-32,4,32);ctx.fillStyle='#a93d32';ctx.fillRect(-1,-h-32,24,14)}
  }else{
   const bob=Math.sin(now*3+o.x)*1.4;
   ctx.fillStyle='#071b1a80';ctx.beginPath();ctx.ellipse(0,3,10,4,0,0,Math.PI*2);ctx.fill();
   if(o===troops[selectedTroop]){ctx.strokeStyle='#f5d16b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,3,16,7,0,0,Math.PI*2);ctx.stroke();}
   // Layered soldier silhouette: cloak, torso, shield, helmet and spear.
   // Keep details legible at the default mobile zoom without external assets.
   const blue=o.team===0,cloth=blue?'#356eaa':'#a3473c',trim=blue?'#a9d4f0':'#f1b49a';
   ctx.fillStyle=blue?'#24466b':'#682e2a';
   ctx.beginPath();ctx.moveTo(-5,-14+bob);ctx.lineTo(-10,-3+bob);ctx.lineTo(7,-3+bob);ctx.lineTo(5,-14+bob);ctx.fill();
   ctx.strokeStyle='#2b2924';ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(-3,-5+bob);ctx.lineTo(-4,1+bob);ctx.moveTo(3,-5+bob);ctx.lineTo(5,1+bob);ctx.stroke();
   ctx.fillStyle=cloth;ctx.fillRect(-6,-17+bob,12,13);
   ctx.fillStyle=trim;ctx.fillRect(-5,-16+bob,10,2);
   ctx.fillStyle='#e5c49a';ctx.beginPath();ctx.arc(0,-21+bob,5,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=blue?'#849ca9':'#8c8580';
   ctx.beginPath();ctx.moveTo(-6,-22+bob);ctx.quadraticCurveTo(-5,-31+bob,0,-30+bob);ctx.quadraticCurveTo(6,-29+bob,6,-22+bob);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#e5d4a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-29+bob);ctx.lineTo(0,-34+bob);ctx.stroke();
   ctx.strokeStyle='#4d3829';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(9,-7+bob);ctx.lineTo(11,-37+bob);ctx.stroke();
   ctx.fillStyle='#d2d5d1';ctx.beginPath();ctx.moveTo(11,-42+bob);ctx.lineTo(8,-35+bob);ctx.lineTo(14,-35+bob);ctx.closePath();ctx.fill();
   ctx.fillStyle=blue?'#537c9b':'#9e5c48';ctx.beginPath();ctx.ellipse(-8,-12+bob,6,9,-.2,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle=trim;ctx.lineWidth=1.7;ctx.stroke();
   ctx.fillStyle='#e6d9af';ctx.beginPath();ctx.arc(-8,-12+bob,2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
 }
 for(const t of tiles){
  // Fractional-depth troops must be drawn before the next deeper tile.
  // At equal depth, paint the ground first so entities remain visible.
  const depth=t.x+t.y;
  while(oi<objects.length&&objects[oi].x+objects[oi].y<depth)renderObject(objects[oi++]);
  const px=(t.x-t.y)*112,py=(t.x+t.y-SIZE)*56;
  const sx=(t.biome%2)*256,sy=Math.floor(t.biome/2)*192;
  const left=width/2+offsetX+(px-128)*scale,top=height/2+offsetY+(py-89)*scale;
  if(!(left>width||top>height||left+256*scale<0||top+192*scale<0)){
   if(atlasLoaded)ctx.drawImage(atlas,sx,sy,256,192,px-128,py-89,256,192);
   else{
    // Procedural diamond fallback keeps the map playable if Safari cannot decode SVG.
    const colors=['#719457','#315f47','#c5a36b','#dce6e6'];
    ctx.fillStyle=colors[t.biome];
    ctx.beginPath();ctx.moveTo(px,py-56);ctx.lineTo(px+112,py);
    ctx.lineTo(px,py+56);ctx.lineTo(px-112,py);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#10242144';ctx.lineWidth=1;ctx.stroke();
   }
  }
  while(oi<objects.length&&objects[oi].x+objects[oi].y===depth)renderObject(objects[oi++]);
 }
 while(oi<objects.length)renderObject(objects[oi++]);
 // Draw queued RTS orders above terrain so their waypoints remain visible.
 const active=orders.get(selectedTroop);
 if(active){const unit=troops[selectedTroop];const path=[{x:unit.x,y:unit.y},...active.route.slice(active.index)];
  ctx.save();ctx.strokeStyle='#ffe49c';ctx.lineWidth=2/scale;ctx.setLineDash([7/scale,5/scale]);ctx.beginPath();
  path.forEach((p,i)=>{const x=(p.x-p.y)*112,y=(p.x+p.y-SIZE)*56;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});
  ctx.stroke();ctx.setLineDash([]);const dest=path[path.length-1];ctx.beginPath();ctx.ellipse((dest.x-dest.y)*112,(dest.x+dest.y-SIZE)*56,15,8,0,0,Math.PI*2);ctx.stroke();ctx.restore();
 }
 ctx.restore();
 renderMinimap();
}
function zoom(factor,x,y){
