<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
<title>Crônicas das Eras — atlas isométrico de terreno, 4 biomas</title>
<desc>Quatro tiles isométricos de 256 por 192 pixels: pradaria, floresta, deserto e neve. Centros em (128,96), (384,96), (128,288), (384,288). Transparência preservada para Canvas.</desc>
<defs>
<linearGradient id="grass" x2="0" y2="1"><stop stop-color="#a8b86b"/><stop offset="1" stop-color="#5f8e50"/></linearGradient>
<linearGradient id="forest" x2="0" y2="1"><stop stop-color="#6d9a56"/><stop offset="1" stop-color="#365c40"/></linearGradient>
<linearGradient id="sand" x2="0" y2="1"><stop stop-color="#e6cf87"/><stop offset="1" stop-color="#c29b57"/></linearGradient>
<linearGradient id="snow" x2="0" y2="1"><stop stop-color="#f0f5ee"/><stop offset="1" stop-color="#c1d9dc"/></linearGradient>
<linearGradient id="pine" x2="0" y2="1"><stop stop-color="#3f7455"/><stop offset="1" stop-color="#163e35"/></linearGradient>
<g id="tuft" fill="none" stroke="#355e39" stroke-width="2" stroke-linecap="round"><path d="M-5 0l-3-5M-3 0l1-8M0 0l4-6M2 0l7-3"/></g>
<g id="tree"><ellipse cx="0" cy="5" rx="17" ry="6" fill="#142f2c" opacity=".35"/><path d="M-3 3V-25h6V3" fill="#694b35"/><path d="M0-68L-24-29H-14L-29-12H29L14-29H24Z" fill="url(#pine)" stroke="#173d32" stroke-width="2"/><path d="M0-68L-3-29L-12-13H0Z" fill="#7baf77" opacity=".38"/></g>
