<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102421"><title>Crônicas das Eras v0.5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102421;color:#f5e9c7;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;right:0;min-height:68px;padding:calc(env(safe-area-inset-top) + 7px) 12px 9px;background:linear-gradient(#071714ed,#071714ac);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}header>*{pointer-events:auto}strong{font-size:15px}small{color:#c3d4bd;font-size:11px}.resources{text-align:right;line-height:1.5}button{border:1px solid #70977b;background:#234439;color:#fff3d5;border-radius:10px;padding:11px;min-height:43px;font-weight:600;cursor:pointer}button:active{background:#35674d}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:3}nav button{flex:1;max-width:135px;background:#16362bf5;padding:8px 4px;font-size:12px}#panel{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#102922f7;border:1px solid #67876c;border-radius:14px;padding:14px;display:none;z-index:3;max-height:55dvh;overflow:auto;box-shadow:0 10px 35px #0008}#panel.show{display:block}#panel h3{margin:0 0 8px}#panel button{margin:3px}#toast{position:fixed;left:50%;transform:translateX(-50%);top:95px;z-index:5;padding:10px 15px;border-radius:16px;background:#0c241ce8;opacity:0;pointer-events:none;max-width:85vw;text-align:center}#tip{position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:10px;color:#eee1bd;background:#0e2920b5;padding:6px 9px;border-radius:8px;font-size:11px;pointer-events:none}@media(min-width:750px){#panel{width:330px;left:auto;right:15px;bottom:82px}nav{left:50%;right:auto;transform:translateX(-50%);width:550px}}
</style></head><body><canvas id="world"></canvas><header><div><strong>⚔️ CRÔNICAS DAS ERAS</strong><div><small id="era">Era Primordial · Dia 1</small></div></div><div class="resources" id="res"></div></header><div id="toast"></div><div id="tip">Arraste o mapa · pinça para zoom · Tropas → Mover</div><div id="panel"></div><nav><button id="home">🏠 Aldeia</button><button id="build">🔨 Construir</button><button id="army">⚔️ Tropas</button><button id="next">☀️ + Dia</button><button id="zoom">🔎 Zoom</button></nav>
<script>
(()=>{
"use strict";
const C=document.getElementById('world'),ctx=C.getContext('2d',{alpha:false}),res=document.getElementById('res'),panel=document.getElementById('panel'),eraLabel=document.getElementById('era');
const W=160,H=160,S=34;
let dpr=1,w=0,h=0,scale=1,cx=80,cy=80,selected=null,dirty=true,dragged=false;
const eras=['Primordial','Tribal','Antiga','Clássica','Medieval','Renascença','Industrial','Contemporânea'];
const rnd=(x,y,z=0)=>{let n=Math.sin(x*127.1+y*311.7+z*78.233)*43758.5453;return n-Math.floor(n)};
const noise=(x,y,f)=>{let xx=x/f,yy=y/f,a=Math.floor(xx),b=Math.floor(yy),u=xx-a,v=yy-b;u=u*u*(3-2*u);v=v*v*(3-2*v);let l=(p,q)=>rnd(p,q);return (l(a,b)*(1-u)+l(a+1,b)*u)*(1-v)+(l(a,b+1)*(1-u)+l(a+1,b+1)*u)*v};
function biome(x,y){if(x<0||y<0||x>=W||y>=H)return 0;let n=noise(x,y,17)*.62+noise(x,y,6)*.38;const lake=noise(x+201,y-144,18);if(n<.28||lake<.20)return 0;if(n>.72)return 5;if(n>.64)return 4;if(n>.48)return 3;if(n>.37)return 2;return 1}
const colors=['#326784','#a4b36a','#7fba70','#2b7045','#8e8774','#6c6c6f'];
let game={day:1,era:0,wood:110,food:130,stone:80,ore:25,people:5,army:2,claim:['80,80'],buildings:[{x:80,y:80,t:'Aldeia'}],units:[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}],enemy:{x:91,y:86,hp:100}};
try{let old=JSON.parse(localStorage.getItem('cronicas-v04'));if(old&&Array.isArray(old.claim))game={...game,...old};if(!Array.isArray(game.units))game.units=[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}];if(!game.enemy)game.enemy={x:91,y:86,hp:100}}catch(e){}
function save(){try{localStorage.setItem('cronicas-v04',JSON.stringify(game))}catch(e){}}
const key=(x,y)=>x+','+y,claimed=()=>new Set(game.claim),at=(x,y)=>game.buildings.find(b=>b.x===x&&b.y===y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;C.width=Math.floor(w*dpr);C.height=Math.floor(h*dpr);dirty=true}
addEventListener('resize',resize);resize();
function draw(){if(!dirty)return;dirty=false;
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#17343b';ctx.fillRect(0,0,w,h);
let ts=S*scale,ox=w/2-cx*ts,oy=h/2-cy*ts;
let x0=Math.max(0,Math.floor(-ox/ts)-2),x1=Math.min(W,Math.ceil((w-ox)/ts)+2),y0=Math.max(0,Math.floor(-oy/ts)-2),y1=Math.min(H,Math.ceil((h-oy)/ts)+2),own=claimed();
const pal=[['#245a72','#327a88','#245b78'],['#879e55','#93a960','#a2b66d'],['#648f4b','#77a65c','#8bae58'],['#356c46','#3e8051','#2e6548'],['#827d68','#9b9073','#79766e'],['#676d66','#8b8981','#606b69']];
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let xx=ox+x*ts,yy=oy+y*ts,b=biome(x,y),q=rnd(x,y,6),c=pal[b];ctx.fillStyle=c[Math.floor(q*3)];ctx.fillRect(xx,yy,ts+1,ts+1);
if(ts>=8){if(b===0){if(q>.45){ctx.strokeStyle='#a5d7d344';ctx.lineWidth=Math.max(.8,ts*.032);ctx.beginPath();ctx.moveTo(xx+ts*.09,yy+ts*(.25+q*.4));ctx.quadraticCurveTo(xx+ts*.46,yy+ts*(.2+q*.4),xx+ts*.78,yy+ts*(.25+q*.4));ctx.stroke()}}
else if(b===3){for(let j=0;j<2+(q>.52?1:0);j++){let px=xx+ts*(.15+rnd(x*3+j,y,1)*.7),py=yy+ts*(.19+rnd(x,y*5+j,2)*.65),rr=ts*(.13+rnd(x+j,y+j,3)*.11);ctx.fillStyle='#213c31';ctx.beginPath();ctx.ellipse(px+rr*.1,py+rr*.25,rr*.9,rr*.55,0,0,7);ctx.fill();ctx.fillStyle=['#285d36','#367849','#448252'][j%3];ctx.beginPath();ctx.arc(px,py,rr,0,7);ctx.fill();ctx.fillStyle='#76a05f77';ctx.beginPath();ctx.arc(px-rr*.33,py-rr*.32,rr*.37,0,7);ctx.fill()}}
else if(b===4||b===5){ctx.fillStyle='#4d4f4c88';ctx.beginPath();ctx.moveTo(xx+ts*.12,yy+ts*.82);ctx.lineTo(xx+ts*.58,yy+ts*.14);ctx.lineTo(xx+ts*.89,yy+ts*.78);ctx.fill();ctx.fillStyle=b===5?'#b5b5a8':'#b3a68a';ctx.beginPath();ctx.moveTo(xx+ts*.17,yy+ts*.71);ctx.lineTo(xx+ts*.52,yy+ts*.13);ctx.lineTo(xx+ts*.67,yy+ts*.55);ctx.fill();if(b===5){ctx.fillStyle='#ece9db';ctx.beginPath();ctx.moveTo(xx+ts*.52,yy+ts*.13);ctx.lineTo(xx+ts*.39,yy+ts*.36);ctx.lineTo(xx+ts*.52,yy+ts*.32);ctx.lineTo(xx+ts*.62,yy+ts*.42);ctx.fill()}}
else if(b===2){if(q>.48){ctx.fillStyle='#315d34';for(let j=0;j<3;j++){let px=xx+ts*rnd(x+j,y,7),py=yy+ts*rnd(x,y+j,8);ctx.fillRect(px,py,Math.max(1,ts*.045),ts*.12)}}if(q>.82){ctx.fillStyle='#e0ba53';for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(xx+ts*rnd(x+j,y,3),yy+ts*rnd(x,y+j,4),Math.max(1,ts*.045),0,7);ctx.fill()}}}
else if(b===1&&q>.72){ctx.fillStyle='#d2c57a';ctx.beginPath();ctx.ellipse(xx+ts*.5,yy+ts*.65,ts*.19,ts*.06,0,0,7);ctx.fill()}}
if(own.has(key(x,y))){ctx.fillStyle='#e9d07716';ctx.fillRect(xx,yy,ts,ts);ctx.strokeStyle='#f8e3a2';ctx.lineWidth=Math.max(1,ts*.04);ctx.strokeRect(xx+1,yy+1,ts-2,ts-2)}
}
function hut(px,py,z,big){let ww=z*(big?.72:.58),hh=z*(big?.55:.46);ctx.fillStyle='#142a24aa';ctx.beginPath();ctx.ellipse(px,py+hh*.38,ww*.63,hh*.23,0,0,7);ctx.fill();ctx.fillStyle='#bba171';ctx.fillRect(px-ww*.4,py-hh*.05,ww*.8,hh*.48);ctx.fillStyle='#825338';ctx.beginPath();ctx.moveTo(px-ww*.57,py-hh*.03);ctx.lineTo(px,py-hh*.78);ctx.lineTo(px+ww*.57,py-hh*.03);ctx.closePath();ctx.fill();ctx.strokeStyle='#d6ab68';ctx.lineWidth=Math.max(1,z*.04);ctx.beginPath();ctx.moveTo(px-ww*.57,py-hh*.03);ctx.lineTo(px,py-hh*.78);ctx.lineTo(px+ww*.57,py-hh*.03);ctx.stroke();ctx.fillStyle='#4c3226';ctx.fillRect(px-ww*.1,py+hh*.14,ww*.2,hh*.29)}
if(game.enemy&&game.enemy.hp>0){let ex=ox+(game.enemy.x+.5)*ts,ey=oy+(game.enemy.y+.5)*ts;if(ex>-ts&&ex<w+ts&&ey>-ts&&ey<h+ts){hut(ex,ey,ts,true);ctx.fillStyle='#b74e3b';ctx.fillRect(ex+ts*.24,ey-ts*.65,Math.max(2,ts*.05),ts*.36);ctx.beginPath();ctx.moveTo(ex+ts*.29,ey-ts*.66);ctx.lineTo(ex+ts*.65,ey-ts*.54);ctx.lineTo(ex+ts*.29,ey-ts*.46);ctx.fill();ctx.fillStyle='#de7468';ctx.fillRect(ex-ts*.34,ey-ts*.78,ts*.68*game.enemy.hp/100,Math.max(2,ts*.06))}}
for(let b of game.buildings){let px=ox+(b.x+.5)*ts,py=oy+(b.y+.5)*ts;if(px<-ts||px>w+ts||py<-ts||py>h+ts)continue;if(b.t==='Aldeia'||b.t==='Cabana'||b.t==='Quartel'){hut(px,py,ts,b.t!=='Cabana');if(b.t==='Quartel'){ctx.fillStyle='#d9ceaa';ctx.fillRect(px-ts*.32,py-ts*.12,ts*.13,ts*.42);ctx.fillRect(px+ts*.2,py-ts*.12,ts*.13,ts*.42)}}else if(b.t==='Fazenda'){ctx.fillStyle='#9c7d42';ctx.fillRect(px-ts*.39,py-ts*.31,ts*.78,ts*.68);ctx.strokeStyle='#dfc369';ctx.lineWidth=Math.max(1,ts*.045);for(let j=0;j<5;j++){ctx.beginPath();ctx.moveTo(px-ts*.3+j*ts*.15,py-ts*.26);ctx.lineTo(px-ts*.3+j*ts*.15,py+ts*.3);ctx.stroke()}}else{ctx.fillStyle='#464c46';ctx.fillRect(px-ts*.3,py-ts*.06,ts*.6,ts*.42);ctx.fillStyle='#b5a47d';ctx.beginPath();ctx.moveTo(px-ts*.38,py-ts*.08);ctx.lineTo(px,py-ts*.45);ctx.lineTo(px+ts*.38,py-ts*.08);ctx.fill();ctx.strokeStyle='#d2c496';ctx.lineWidth=Math.max(1,ts*.075);ctx.beginPath();ctx.moveTo(px-ts*.12,py+ts*.16);ctx.lineTo(px+ts*.25,py-ts*.23);ctx.stroke()}}
for(let u of game.units){let ux=ox+u.x*ts,uy=oy+u.y*ts;if(ux<-ts||ux>w+ts||uy<-ts||uy>h+ts)continue;let r=Math.max(3,ts*.105);ctx.fillStyle='#14281f88';ctx.beginPath();ctx.ellipse(ux,uy+r*.85,r*1.1,r*.4,0,0,7);ctx.fill();ctx.fillStyle=u.kind==='worker'?'#d5a16c':'#a8b4c7';ctx.beginPath();ctx.arc(ux,uy-r*.6,r*.55,0,7);ctx.fill();ctx.fillStyle=u.kind==='worker'?'#e8bd69':'#536a85';ctx.fillRect(ux-r*.6,uy-r*.1,r*1.2,r*1.3);if(u.kind==='warrior'){ctx.strokeStyle='#d3d7c9';ctx.lineWidth=Math.max(1,ts*.045);ctx.beginPath();ctx.moveTo(ux+r*.55,uy-r*.2);ctx.lineTo(ux+r*1.2,uy-r*1.5);ctx.stroke()}if(u===game.units[selectedUnit]){ctx.strokeStyle='#ffe19a';ctx.lineWidth=Math.max(1.5,ts*.045);ctx.beginPath();ctx.ellipse(ux,uy+r*.6,r*1.45,r*.6,0,0,7);ctx.stroke()}}
if(selected){let xx=ox+selected.x*ts,yy=oy+selected.y*ts;ctx.strokeStyle='#f5e8ad';ctx.lineWidth=2;ctx.strokeRect(xx+2,yy+2,ts-4,ts-4)}
}
function refresh(){eraLabel.textContent='Era '+eras[game.era]+' · Dia '+game.day;res.innerHTML='🪵 '+game.wood+' &nbsp; 🍎 '+game.food+'<br>🪨 '+game.stone+' &nbsp; ⛏️ '+game.ore+' &nbsp; 👥 '+game.people;dirty=true;save()}
let command=null,selectedUnit=0,live=0,lastFrame=0,autosave=0;let timer=0;function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(timer);timer=setTimeout(()=>el.style.opacity=0,2600)}
function menu(title,html){panel.classList.add('show');panel.innerHTML='<h3>'+title+'</h3>'+html+'<p><button id="close">Fechar</button></p>';document.getElementById('close').onclick=()=>panel.classList.remove('show')}
function spend(wood,food,stone,ore=0){if(game.wood<wood||game.food<food||game.stone<stone||game.ore<ore){toast('Recursos insuficientes');return false}game.wood-=wood;game.food-=food;game.stone-=stone;game.ore-=ore;return true}
const adjacent=(x,y)=>game.claim.some(s=>{let [a,b]=s.split(',').map(Number);return Math.abs(x-a)+Math.abs(y-b)===1});
function tileMenu(){if(!selected)return;let{x,y}=selected,b=biome(x,y),owned=game.claim.includes(key(x,y)),existing=at(x,y);menu('Região '+x+', '+y,'<p>Terreno: '+['Lago','Campina','Pradaria','Floresta','Colina','Montanha'][b]+'</p><p>'+(owned?'✅ Seu território':'Território não dominado')+(existing?' · '+existing.t:'')+'</p><button id="claim">🏳️ Dominar (🍎 12 🪵 5)</button>');document.getElementById('claim').onclick=()=>{if(owned)return toast('Já é seu território');if(b===0||b===5)return toast('Terreno impróprio para ocupação');if(!adjacent(x,y))return toast('Conquiste primeiro uma região vizinha');if(!spend(5,12,0))return;game.claim.push(key(x,y));refresh();tileMenu();toast('Território conquistado!')}}
function buildMenu(){menu('Construir na região selecionada','<p>Escolha uma região dominada e vazia.</p><button data-t="Cabana">🛖 Cabana · 🪵 35 🍎 15</button><button data-t="Fazenda">🌾 Fazenda · 🪵 30 🪨 15</button><button data-t="Mina">⛏️ Mina · 🪵 25 🪨 25</button><button data-t="Quartel">🏰 Quartel · 🪵 70 🪨 50</button>');panel.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{if(!selected)return toast('Selecione uma região');let{x,y}=selected;if(!game.claim.includes(key(x,y))||at(x,y))return toast('Escolha um terreno dominado e vazio');let t=el.dataset.t,price={Cabana:[35,15,0],Fazenda:[30,0,15],Mina:[25,0,25],Quartel:[70,0,50]}[t];if(!spend(...price))return;game.buildings.push({x,y,t});if(t==='Cabana')game.people+=2;refresh();toast(t+' construída!');buildMenu()})}
function armyMenu(){menu('Unidades e civilização','<p>🛡️ Guerreiros: '+game.army+' · População: '+game.people+'</p><p>Selecione uma unidade e toque no mapa para enviá-la até o destino. Trabalhadores coletam recursos automaticamente ao chegar.</p><button id="choose">👤 Alternar unidade ('+(selectedUnit+1)+'/'+game.units.length+')</button><button id="move">📍 Mover unidade</button><button id="train">⚔️ Treinar guerreiro (🍎 30 🪵 15)</button><button id="advance">🏛️ Evoluir era (🪵 160 🍎 160 🪨 100 ⛏️ 40)</button>');document.getElementById('choose').onclick=()=>{selectedUnit=(selectedUnit+1)%game.units.length;dirty=true;armyMenu()};document.getElementById('move').onclick=()=>{command='move';panel.classList.remove('show');toast('Toque no destino da unidade no mapa')};document.getElementById('train').onclick=()=>{if(!game.buildings.some(b=>b.t==='Quartel'))return toast('Construa um quartel');if(!spend(15,30,0))return;game.army++;game.units.push({x:80.5,y:80.5,tx:80.5,ty:80.5,kind:'warrior'});refresh();armyMenu()};document.getElementById('advance').onclick=()=>{if(game.era>=eras.length-1)return toast('Você chegou à era atual');if(!spend(160,160,100,40))return;game.era++;refresh();armyMenu();toast('Nova era: '+eras[game.era])}}
function nextDay(){game.day++;let farms=game.buildings.filter(x=>x.t==='Fazenda').length,mines=game.buildings.filter(x=>x.t==='Mina').length;game.food+=15+farms*15;game.wood+=12;game.stone+=4+mines*8;game.ore+=2+mines*4;refresh();toast('Dia '+game.day+' · recursos coletados')}
document.getElementById('home').onclick=()=>{cx=80;cy=80;scale=1.3;selected={x:80,y:80};dirty=true;tileMenu()};
document.getElementById('build').onclick=buildMenu;document.getElementById('army').onclick=armyMenu;document.getElementById('next').onclick=nextDay;document.getElementById('zoom').onclick=()=>{scale=scale>=2?0.65:scale+.35;dirty=true};
let pointers=new Map(),lastDist=0,down=null;
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){down={x:e.clientX,y:e.clientY};dragged=false}if(pointers.size===2)lastDist=0});
C.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);let dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragged=true;cx=Math.max(0,Math.min(W-1,cx-dx/(S*scale)));cy=Math.max(0,Math.min(H-1,cy-dy/(S*scale)))}else{let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)scale=Math.max(.45,Math.min(3,scale*dist/lastDist));lastDist=dist;dragged=true}dirty=true});
C.addEventListener('pointerup',e=>{if(!dragged&&pointers.size===1&&down){let x=Math.floor(cx+(e.clientX-w/2)/(S*scale)),y=Math.floor(cy+(e.clientY-h/2)/(S*scale));if(x>=0&&x<W&&y>=0&&y<H){if(command==='move'){let u=game.units[selectedUnit];if(biome(x,y)===0||biome(x,y)===5){toast('Unidade não atravessa lagos ou montanhas')}else{u.tx=x+.5;u.ty=y+.5;toast('Unidade enviada ao destino');save()}command=null}else{selected={x,y};tileMenu()}dirty=true}}pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0});C.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));C.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(3,scale*(e.deltaY>0?.88:1.12)));dirty=true},{passive:false});
function loop(t){let dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000||0));lastFrame=t;for(let u of game.units){let dx=u.tx-u.x,dy=u.ty-u.y,len=Math.hypot(dx,dy);if(len>.035){let step=Math.min(len,dt*(u.kind==='warrior'?2.3:1.5));u.x+=dx/len*step;u.y+=dy/len*step;dirty=true}}live+=dt;autosave+=dt;if(live>=4){live=0;let gains={wood:0,food:0,stone:0,ore:0};for(let u of game.units.filter(u=>u.kind==='worker')){let x=Math.floor(u.x),y=Math.floor(u.y),b=biome(x,y);if(Math.hypot(u.tx-u.x,u.ty-u.y)>.15)continue;if(b===3)gains.wood+=2;else if(b===4){gains.stone+=1;gains.ore+=1}else if(b===1||b===2)gains.food+=2}for(let k of Object.keys(gains))game[k]+=gains[k];if(Object.values(gains).some(Boolean))refresh();if(game.enemy&&game.enemy.hp>0){let troops=game.units.filter(u=>u.kind==='warrior'&&Math.hypot(u.x-(game.enemy.x+.5),u.y-(game.enemy.y+.5))<1.2).length;if(troops){game.enemy.hp=Math.max(0,game.enemy.hp-troops*5);dirty=true;if(game.enemy.hp===0){game.claim.push(key(game.enemy.x,game.enemy.y));toast('Tribo rival derrotada! Território conquistado.');refresh()}}}}if(autosave>12){autosave=0;save()}draw();requestAnimationFrame(loop)}refresh();requestAnimationFrame(loop);toast('Versão 0.5: aldeões em movimento e tribo rival!');
})();
</script></body></html>
