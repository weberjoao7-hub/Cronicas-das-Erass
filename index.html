<style>
*{box-sizing:border-box}body{margin:0;background:#102421;color:#f5e9c7;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;right:0;min-height:68px;padding:calc(env(safe-area-inset-top) + 7px) 12px 9px;background:linear-gradient(#071714ed,#071714ac);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}header>*{pointer-events:auto}strong{font-size:15px}small{color:#c3d4bd;font-size:11px}.resources{text-align:right;line-height:1.5}button{border:1px solid #70977b;background:#234439;color:#fff3d5;border-radius:10px;padding:11px;min-height:43px;font-weight:600;cursor:pointer}button:active{background:#35674d}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:3}nav button{flex:1;max-width:135px;background:#16362bf5;padding:8px 4px;font-size:12px}#panel{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#102922f7;border:1px solid #67876c;border-radius:14px;padding:14px;display:none;z-index:3;max-height:55dvh;overflow:auto;box-shadow:0 10px 35px #0008}#panel.show{display:block}#panel h3{margin:0 0 8px}#panel button{margin:3px}#toast{position:fixed;left:50%;transform:translateX(-50%);top:95px;z-index:5;padding:10px 15px;border-radius:16px;background:#0c241ce8;opacity:0;pointer-events:none;max-width:85vw;text-align:center}#tip{position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:10px;color:#eee1bd;background:#0e2920b5;padding:6px 9px;border-radius:8px;font-size:11px;pointer-events:none}@media(min-width:750px){#panel{width:330px;left:auto;right:15px;bottom:82px}nav{left:50%;right:auto;transform:translateX(-50%);width:550px}}

<script>
(()=>{
"use strict";
const C=document.getElementById('world'),ctx=C.getContext('2d',{alpha:false}),res=document.getElementById('res'),panel=document.getElementById('panel'),eraLabel=document.getElementById('era');
const W=160,H=160,S=34;const M=document.getElementById("minimap"),mc=M.getContext("2d");
let dpr=1,w=0,h=0,scale=1,cx=80,cy=80,selected=null,dirty=true,dragged=false;
const eras=['Primordial','Tribal','Antiga','Clássica','Medieval','Renascença','Industrial','Contemporânea'];
const rnd=(x,y,z=0)=>{let n=Math.sin(x*127.1+y*311.7+z*78.233)*43758.5453;return n-Math.floor(n)};
const noise=(x,y,f)=>{let xx=x/f,yy=y/f,a=Math.floor(xx),b=Math.floor(yy),u=xx-a,v=yy-b;u=u*u*(3-2*u);v=v*v*(3-2*v);let l=(p,q)=>rnd(p,q);return (l(a,b)*(1-u)+l(a+1,b)*u)*(1-v)+(l(a,b+1)*(1-u)+l(a+1,b+1)*u)*v};
// Cache de biomas: evita milhares de cálculos de ruído em cada quadro.
const terrain=new Uint8Array(W*H);
function terrainAt(x,y){let d=Math.hypot(x-80,y-80),enemyD=Math.hypot(x-91,y-86);
if(d<3.8||enemyD<2.6)return 2; // aldeias sempre surgem em terra habitável
if(d<5.5)return rnd(x,y,23)>.65?3:2;
let vx=11,vy=6,wx=x-80,wy=y-80,t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy)));
if(t>0&&t<1&&Math.hypot(wx-t*vx,wy-t*vy)<1.35)return 2; // rota terrestre inicial
let n=noise(x,y,17)*.62+noise(x,y,6)*.38,lake=noise(x+201,y-144,18);
if(n<.28||lake<.20)return 0;if(n>.72)return 5;if(n>.64)return 4;if(n>.48)return 3;if(n>.37)return 2;return 1}
for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++)terrain[ty*W+tx]=terrainAt(tx,ty);
function biome(x,y){if(x<0||y<0||x>=W||y>=H)return 0;return terrain[y*W+x]}
const colors=['#326784','#a4b36a','#7fba70','#2b7045','#8e8774','#6c6c6f'];
let game={day:1,era:0,wood:110,food:130,stone:80,ore:25,people:5,army:2,claim:['80,80'],buildings:[{x:80,y:80,t:'Aldeia'}],units:[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}],enemy:{x:91,y:86,hp:100}};
try{let old=JSON.parse(localStorage.getItem('cronicas-v04'));if(old&&Array.isArray(old.claim))game={...game,...old};if(!Array.isArray(game.units))game.units=[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}];if(!game.enemy)game.enemy={x:91,y:86,hp:100};if(!Array.isArray(game.enemyUnits))game.enemyUnits=[];for(let u of game.units)if(!Number.isFinite(u.hp))u.hp=100}catch(e){}
function save(){try{localStorage.setItem('cronicas-v04',JSON.stringify(game))}catch(e){}}
function spawnEnemyGuard(){if(!game.enemy||game.enemy.hp<=0)return false;game.enemyUnits=game.enemyUnits||[];if(game.enemyUnits.length>=4)return false;for(let radius=1;radius<=5;radius++){for(let dx=-radius;dx<=radius;dx++)for(let dy=-radius;dy<=radius;dy++){let x=game.enemy.x+dx,y=game.enemy.y+dy;if(Math.max(Math.abs(dx),Math.abs(dy))!==radius||!passable(x,y))continue;if(game.enemyUnits.some(u=>Math.floor(u.x)===x&&Math.floor(u.y)===y))continue;game.enemyUnits.push({x:x+.5,y:y+.5,hp:65,homeX:x+.5,homeY:y+.5});return true}}return false}
function enemyTurn(dt){
 if(!game.enemy||game.enemy.hp<=0)return;
 for(const guard of game.enemyUnits){
  guard.repath=(guard.repath||0)-dt;
  let nearest=null,dist=Infinity;
  for(const u of game.units){if(u.hp<=0)continue;let d=Math.hypot(u.x-guard.x,u.y-guard.y);if(d<dist){dist=d;nearest=u}}
  const chasing=nearest&&dist<7,goal=chasing?nearest:{x:guard.homeX,y:guard.homeY};
  if(chasing&&dist<1.3){guard.path=[];continue}
  const gx=Math.floor(goal.x),gy=Math.floor(goal.y);
  if(guard.repath<=0&&(!guard.path||!guard.path.length||Math.hypot((guard.goalX??-10)-gx,(guard.goalY??-10)-gy)>1)){
   guard.repath=1.7+((guard.homeX||0)%1);
   if(assignRoute(guard,gx,gy)){guard.goalX=gx;guard.goalY=gy}
  }
  const next=guard.path&&guard.path[0];if(!next)continue;
  const dx=next.x-guard.x,dy=next.y-guard.y,len=Math.hypot(dx,dy);
  if(len<=.06){guard.x=next.x;guard.y=next.y;guard.path.shift();dirty=true}
  else{const step=Math.min(len,dt*1.3);const nx=guard.x+dx/len*step,ny=guard.y+dy/len*step;
   if(passable(Math.floor(nx),Math.floor(ny))){guard.x=nx;guard.y=ny;dirty=true}else{guard.path=[];guard.repath=0}}
 }
}
function warriorAutoEngage(){
 if(!game.enemy||game.enemy.hp<=0)return;
 for(const u of game.units){
  if(u.kind!=='warrior'||u.hp<=0||(u.path&&u.path.length))continue;
  let target=null,dist=5;
  for(const e of game.enemyUnits){if(e.hp<=0)continue;const d=Math.hypot(e.x-u.x,e.y-u.y);if(d<dist){target=e;dist=d}}
  if(target){if(dist>1.2)assignRoute(u,Math.floor(target.x),Math.floor(target.y));continue}
  const baseDist=Math.hypot(u.x-(game.enemy.x+.5),u.y-(game.enemy.y+.5));
  if(baseDist>1.3&&baseDist<4.5)assignRoute(u,game.enemy.x,game.enemy.y);
 }
}
function combatTurn(){if(!game.enemy||game.enemy.hp<=0)return;let hits=false;for(let u of game.units.filter(u=>u.kind==='warrior'&&u.hp>0)){let target=game.enemyUnits.find(e=>e.hp>0&&Math.hypot(u.x-e.x,u.y-e.y)<1.45);if(target){target.hp-=18;target.hitAt=Date.now();hits=true}else if(Math.hypot(u.x-(game.enemy.x+.5),u.y-(game.enemy.y+.5))<1.5){game.enemy.hp=Math.max(0,game.enemy.hp-9);hits=true}}for(let e of game.enemyUnits.filter(e=>e.hp>0)){let target=game.units.filter(u=>u.hp>0&&Math.hypot(u.x-e.x,u.y-e.y)<1.4).sort((a,b)=>(a.kind==='warrior'?0:1)-(b.kind==='warrior'?0:1))[0];if(target){target.hp=Math.max(0,target.hp-11);target.hitAt=Date.now();hits=true}}game.enemyUnits=game.enemyUnits.filter(e=>e.hp>0);let dead=game.units.filter(u=>u.hp<=0);if(dead.length){game.units=game.units.filter(u=>u.hp>0);selectedUnit=Math.min(selectedUnit,Math.max(0,game.units.length-1));game.army=game.units.filter(u=>u.kind==='warrior').length;toast('⚔️ '+dead.length+' unidade(s) perdida(s) em combate');hits=true}if(hits){dirty=true;refresh()}if(game.enemy.hp===0&&!game.won){game.enemyUnits=[];if(!game.claim.includes(key(game.enemy.x,game.enemy.y)))game.claim.push(key(game.enemy.x,game.enemy.y));game.won=true;refresh();menu('🏆 Vitória na primeira batalha','<p>Seus guerreiros derrotaram a tribo rival e conquistaram a região inimiga!</p><button id="continueGame">🌍 Continuar explorando</button>');document.getElementById('continueGame').onclick=()=>panel.classList.remove('show');toast('Vitória! Base inimiga conquistada.')}}
const key=(x,y)=>x+','+y,claimed=()=>new Set(game.claim),at=(x,y)=>game.buildings.find(b=>b.x===x&&b.y===y);
let miniBase=null;function redrawMinimap(){if(miniBase){mc.putImageData(miniBase,0,0);return}let img=miniBase||mc.createImageData(160,160),palette=[[42,104,132],[167,180,110],[123,167,95],[59,119,72],[142,137,113],[118,123,120]];for(let y=0;y<160;y++)for(let x=0;x<160;x++){const p=(y*160+x)*4,c=palette[biome(x,y)];img.data[p]=c[0];img.data[p+1]=c[1];img.data[p+2]=c[2];img.data[p+3]=255}miniBase=img;mc.putImageData(img,0,0)}function drawMinimap(){mc.lineWidth=2;mc.strokeStyle="#ffe7ab";mc.strokeRect(Math.max(0,cx-6),Math.max(0,cy-6),12,12);mc.fillStyle="#55ef9c";for(let k of game.claim){let [x,y]=k.split(",").map(Number);mc.fillRect(x,y,1.4,1.4)}mc.fillStyle="#ffe392";for(let b of game.buildings)mc.fillRect(b.x-1,b.y-1,3,3);if(game.enemy&&game.enemy.hp>0){mc.fillStyle="#e26c63";mc.fillRect(game.enemy.x-2,game.enemy.y-2,5,5);for(let e of game.enemyUnits||[])mc.fillRect(e.x,e.y,2,2)}}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;C.width=Math.floor(w*dpr);C.height=Math.floor(h*dpr);dirty=true}
addEventListener('resize',resize);resize();redrawMinimap();M.addEventListener('pointerdown',e=>{let r=M.getBoundingClientRect();cx=Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/r.width*160)));cy=Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/r.height*160)));dirty=true;toast('Câmera deslocada pelo minimapa')});
const TW=74,TH=38;
// Texturas pré-renderizadas: tons, sombras e microdetalhes sem custo por quadro.
const tileArt=Array.from({length:6},(_,biomeId)=>Array.from({length:5},(_,variant)=>{
const can=document.createElement('canvas');can.width=148;can.height=76;const g=can.getContext('2d'),ww=148,hh=76;
const palette=[['#265f80','#3585a0'],['#8c9c61','#c4c38a'],['#699e52','#99bf6e'],['#356e43','#548c52'],['#7e7869','#aca28a'],['#696e71','#a4a6a1']];
g.beginPath();g.moveTo(ww/2,0);g.lineTo(ww,hh/2);g.lineTo(ww/2,hh);g.lineTo(0,hh/2);g.closePath();g.save();g.clip();
const grad=g.createLinearGradient(0,0,0,hh);grad.addColorStop(0,palette[biomeId][1]);grad.addColorStop(1,palette[biomeId][0]);g.fillStyle=grad;g.fillRect(0,0,ww,hh);
for(let i=0;i<38;i++){let ax=rnd(i+variant*7,biomeId*8,10)*ww,ay=rnd(i,variant*7+biomeId,13)*hh;
if(Math.abs(ax-ww/2)/(ww/2)+Math.abs(ay-hh/2)/(hh/2)>.85)continue;
let size=1+rnd(i,biomeId+variant,18)*3;
if(biomeId===0){g.strokeStyle=i%3===0?'#c5e4df42':'#163e5b38';g.lineWidth=1.3;g.beginPath();g.moveTo(ax-size*2,ay);g.quadraticCurveTo(ax,ay-size,ax+size*3,ay);g.stroke()}
else if(biomeId===4||biomeId===5){g.fillStyle=i%2?'#d3c8a42c':'#36433e36';g.beginPath();g.ellipse(ax,ay,size*2,size*.65,-.25,0,Math.PI*2);g.fill()}
else {g.fillStyle=i%4===0?'#e7c86e7a':i%3===0?'#305c354c':'#e0d59d30';g.beginPath();g.ellipse(ax,ay,size*.8,size*.35,rnd(i,variant,6)*3,0,Math.PI*2);g.fill()}
}
if(biomeId===1){g.strokeStyle='#d9d1a45a';g.lineWidth=1.5;for(let i=0;i<3;i++){let x=ww*.35+i*ww*.14;g.beginPath();g.moveTo(x,hh*.42);g.lineTo(x+3,hh*.34);g.stroke()}}
g.restore();return can;
}));

function point(x,y,z=0){return [w/2+((x-y)-(cx-cy))*TW*.5*scale,h*.47+((x+y)-(cx+cy))*TH*.5*scale-z*scale]}
function tileAt(px,py){let a=(px-w/2)/(TW*.5*scale)+(cx-cy),b=(py-h*.47)/(TH*.5*scale)+(cx+cy);return {x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,ww,hh,fill,stroke){ctx.beginPath();ctx.moveTo(x,y-hh*.5);ctx.lineTo(x+ww*.5,y);ctx.lineTo(x,y+hh*.5);ctx.lineTo(x-ww*.5,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,scale);ctx.stroke()}}
function tree(x,y,s,k){ctx.fillStyle='#142b2099';ctx.beginPath();ctx.ellipse(x+s*.12,y+s*.16,s*.66,s*.21,-.1,0,7);ctx.fill();ctx.fillStyle='#65442d';ctx.beginPath();ctx.moveTo(x-s*.095,y);ctx.lineTo(x-s*.065,y-s*.82);ctx.lineTo(x+s*.07,y-s*.82);ctx.lineTo(x+s*.11,y);ctx.fill();let cols=['#245b36','#327547','#3d8751','#478b52'];for(let i=0;i<4;i++){let cy=y-s*(.6+i*.24),r=s*(.52-i*.075);ctx.fillStyle=cols[(k+i)%cols.length];ctx.beginPath();ctx.moveTo(x,cy-r*1.4);ctx.lineTo(x-r,cy+r*.55);ctx.quadraticCurveTo(x,cy+r*.3,x+r,cy+r*.55);ctx.closePath();ctx.fill();ctx.strokeStyle='#193d2b55';ctx.lineWidth=Math.max(.6,s*.035);ctx.stroke()}ctx.fillStyle='#9ec47a66';ctx.beginPath();ctx.moveTo(x-s*.15,y-s*1.44);ctx.lineTo(x,y-s*1.61);ctx.lineTo(x+s*.12,y-s*1.3);ctx.closePath();ctx.fill()}
function rock(x,y,s){ctx.fillStyle='#27322b66';ctx.beginPath();ctx.ellipse(x+s*.1,y+s*.16,s*.87,s*.27,0,0,7);ctx.fill();ctx.fillStyle='#5d6763';ctx.beginPath();ctx.moveTo(x-s*.78,y+s*.14);ctx.lineTo(x-s*.26,y-s*.87);ctx.lineTo(x+s*.22,y-s*.78);ctx.lineTo(x+s*.8,y-s*.1);ctx.lineTo(x+s*.5,y+s*.27);ctx.closePath();ctx.fill();ctx.fillStyle='#a9ada4';ctx.beginPath();ctx.moveTo(x-s*.26,y-s*.87);ctx.lineTo(x+s*.22,y-s*.78);ctx.lineTo(x+s*.03,y-s*.22);ctx.lineTo(x-s*.48,y-s*.12);ctx.closePath();ctx.fill();ctx.fillStyle='#e1ddd044';ctx.beginPath();ctx.moveTo(x-s*.26,y-s*.87);ctx.lineTo(x-s*.05,y-s*.68);ctx.lineTo(x-s*.18,y-s*.43);ctx.closePath();ctx.fill()}
function house(x,y,s,kind){
 const ww=s*(kind==='Aldeia'?.9:.73),hh=s*.73,stone=kind==='Quartel',roof=stone?'#485c67':'#805035';
 // Sombra de contato e fundação em perspectiva.
 ctx.fillStyle='#071b1780';ctx.beginPath();ctx.ellipse(x+s*.12,y+s*.3,ww*.82,s*.22,-.12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=stone?'#737b75':'#907657';ctx.beginPath();ctx.moveTo(x-ww*.53,y+hh*.29);ctx.lineTo(x+ww*.49,y+hh*.29);ctx.lineTo(x+ww*.68,y+hh*.12);ctx.lineTo(x-ww*.34,y+hh*.12);ctx.closePath();ctx.fill();
 // Paredes frontais e lateral sombreada.
 ctx.fillStyle=stone?'#b4b8ac':'#d5bc91';ctx.fillRect(x-ww*.49,y-hh*.31,ww*.98,hh*.59);
 ctx.fillStyle=stone?'#7c8786':'#aa845e';ctx.beginPath();ctx.moveTo(x+ww*.49,y-hh*.31);ctx.lineTo(x+ww*.66,y-hh*.48);ctx.lineTo(x+ww*.66,y+hh*.13);ctx.lineTo(x+ww*.49,y+hh*.28);ctx.closePath();ctx.fill();
 ctx.fillStyle='#6a4b33';ctx.fillRect(x-ww*.47,y+hh*.19,ww*.95,hh*.09);
 // Telhado de duas águas: faces iluminada e sombreada.
 ctx.fillStyle=stone?'#60737b':'#a56b43';ctx.beginPath();ctx.moveTo(x-ww*.64,y-hh*.32);ctx.lineTo(x-ww*.04,y-hh*1.2);ctx.lineTo(x+ww*.2,y-hh*1.32);ctx.lineTo(x+ww*.76,y-hh*.5);ctx.lineTo(x+ww*.52,y-hh*.29);ctx.lineTo(x-ww*.64,y-hh*.32);ctx.closePath();ctx.fill();
 ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(x-ww*.64,y-hh*.32);ctx.lineTo(x-ww*.04,y-hh*1.2);ctx.lineTo(x+ww*.51,y-hh*.32);ctx.closePath();ctx.fill();
 ctx.fillStyle=stone?'#374a56':'#583d2d';ctx.beginPath();ctx.moveTo(x-ww*.04,y-hh*1.2);ctx.lineTo(x+ww*.2,y-hh*1.32);ctx.lineTo(x+ww*.76,y-hh*.5);ctx.lineTo(x+ww*.51,y-hh*.32);ctx.closePath();ctx.fill();
 // Fileiras de telhas, batentes e reflexos.
 ctx.strokeStyle=stone?'#a0abb0aa':'#d59b66a8';ctx.lineWidth=Math.max(.7,s*.018);
 for(let i=1;i<=3;i++){let t=i/4;ctx.beginPath();ctx.moveTo(x-ww*.64+(ww*.6)*t,y-hh*.32-hh*.88*t);ctx.lineTo(x+ww*.51-ww*.55*t,y-hh*.32-hh*.88*t);ctx.stroke()}
 ctx.fillStyle='#453429';ctx.fillRect(x-ww*.12,y-hh*.05,ww*.24,hh*.34);
 ctx.fillStyle='#a77d4b';ctx.fillRect(x+ww*.045,y+hh*.07,Math.max(1,s*.025),Math.max(1,s*.025));
 for(const wx of [-.35,.26]){ctx.fillStyle='#493e33';ctx.fillRect(x+ww*wx,y-hh*.13,ww*.13,hh*.19);ctx.fillStyle='#a8c5c1';ctx.fillRect(x+ww*wx+ww*.02,y-hh*.11,ww*.09,hh*.14)}
 if(kind==='Aldeia'||stone){let t=Date.now()*.002;ctx.strokeStyle='#dfcda0';ctx.lineWidth=Math.max(1,s*.024);ctx.beginPath();ctx.moveTo(x+ww*.62,y-hh*.42);ctx.lineTo(x+ww*.62,y-hh*1.4);ctx.stroke();ctx.fillStyle=stone?'#b9c8db':'#5ee8a3';ctx.beginPath();ctx.moveTo(x+ww*.62,y-hh*1.4);ctx.quadraticCurveTo(x+ww*(.88+Math.sin(t)*.04),y-hh*1.32,x+ww*.96,y-hh*1.16);ctx.lineTo(x+ww*.62,y-hh*1.09);ctx.closePath();ctx.fill()}

function constructionStand(b,u){
 let options=[];for(let r=0;r<=2;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
  if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
  let x=b.x+dx,y=b.y+dy;if(!passable(x,y))continue;
  options.push({x,y,dist:Math.hypot(u.x-(x+.5),u.y-(y+.5))});
 }
 options.sort((a,b)=>a.dist-b.dist);
 for(let p of options){let path=routeFor(u,p.x,p.y);if(path)return {p,path}}
 return null
}
function assignBuilders(){
 let works=game.buildings.filter(b=>b.buildLeft>0);
 for(let u of game.units.filter(u=>u.kind==='worker')){
  if(u.buildTarget&&!works.some(b=>key(b.x,b.y)===u.buildTarget)){u.buildTarget=null;u.job=false;u.path=[]}
 }
 for(let b of works){
  let assigned=game.units.filter(u=>u.kind==='worker'&&u.buildTarget===key(b.x,b.y)).length;
  if(assigned>=2)continue;
  let candidates=game.units.filter(u=>u.kind==='worker'&&!u.buildTarget).sort((a,c)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y));
  for(let u of candidates){
   if(assigned>=2)break;
   let stand=constructionStand(b,u);if(!stand)continue;
   u.buildTarget=key(b.x,b.y);u.job=true;u.path=stand.path;u.tx=stand.p.x+.5;u.ty=stand.p.y+.5;assigned++;dirty=true;
  }
 }
}
function assignWorkers(){let targets=[];for(let radius=1;radius<=12&&targets.length<12;radius++)for(let y=80-radius;y<=80+radius;y++)for(let x=80-radius;x<=80+radius;x++){if(x<0||y<0||x>=W||y>=H||Math.max(Math.abs(x-80),Math.abs(y-80))!==radius)continue;let b=biome(x,y);if(b===3||b===4||b===1||b===2)targets.push({x,y,b});}let workers=game.units.filter(u=>u.kind==='worker');for(let i=0;i<workers.length;i++){let u=workers[i];if(u.buildTarget)continue;if(u.path&&u.path.length)continue;let b=biome(Math.floor(u.x),Math.floor(u.y));if(u.job&&Math.hypot(u.x-u.tx,u.y-u.ty)<.2&&(b===3||b===4||b===1||b===2))continue;let preferred=i%3===0?3:i%3===1?4:2;let dest=targets.find(t=>t.b===preferred)||targets.find(t=>t.b===1||t.b===2)||targets[0];if(dest&&assignRoute(u,dest.x,dest.y)){u.job=true;dirty=true}}}
document.getElementById('home').onclick=()=>{cx=80;cy=80;scale=1.3;selected={x:80,y:80};dirty=true;tileMenu()};
document.getElementById('build').onclick=buildMenu;document.getElementById('army').onclick=armyMenu;document.getElementById('help').onclick=showTutorial;document.getElementById('zoom').onclick=()=>{scale=scale>=2?0.65:scale+.35;dirty=true};
function passable(x,y){return x>=0&&y>=0&&x<W&&y<H&&biome(x,y)!==0&&biome(x,y)!==5}
function routeFor(u,x,y){let sx=Math.floor(u.x),sy=Math.floor(u.y),tx=Math.floor(x),ty=Math.floor(y);if(!passable(tx,ty))return null;let start=key(sx,sy),goal=key(tx,ty);if(start===goal)return [{x:tx+.5,y:ty+.5}];let queue=[[sx,sy]],seen=new Set([start]),prev=new Map(),head=0,found=false;while(head<queue.length&&head<12000){let [cx,cy]=queue[head++];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=cx+dx,ny=cy+dy,k=key(nx,ny);if(!passable(nx,ny)||seen.has(k))continue;seen.add(k);prev.set(k,key(cx,cy));if(k===goal){found=true;break}queue.push([nx,ny])}if(found)break}if(!found)return null;let tiles=[],node=goal;while(node!==start&&tiles.length<12000){let [ax,ay]=node.split(',').map(Number);tiles.push({x:ax+.5,y:ay+.5});node=prev.get(node);if(!node)return null}tiles.reverse();return tiles}
function assignRoute(u,x,y){let path=routeFor(u,x,y);if(!path)return false;u.path=path;u.tx=x+.5;u.ty=y+.5;return true}
let pointers=new Map(),lastDist=0,down=null;
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){down={x:e.clientX,y:e.clientY};dragged=false}if(pointers.size===2)lastDist=0});
C.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);let dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragged=true;cx=Math.max(0,Math.min(W-1,cx-(dx/(TW*scale)+dy/(TH*scale))));cy=Math.max(0,Math.min(H-1,cy-(-dx/(TW*scale)+dy/(TH*scale))))}else{let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)scale=Math.max(.45,Math.min(3,scale*dist/lastDist));lastDist=dist;dragged=true}dirty=true});
C.addEventListener('pointerup',e=>{if(!dragged&&pointers.size===1&&down){let {x,y}=tileAt(e.clientX,e.clientY);if(x>=0&&x<W&&y>=0&&y<H){if(command==='move'){let u=game.units[selectedUnit];if(biome(x,y)===0||biome(x,y)===5){toast('Unidade não atravessa lagos ou montanhas')}else{if(assignRoute(u,x,y)){toast('Caminho calculado: unidade enviada');save()}else toast('Não há caminho terrestre até o destino')}command=null}else{selected={x,y};let unitIndex=game.units.findIndex(u=>Math.floor(u.x)===x&&Math.floor(u.y)===y);if(unitIndex>=0){selectedUnit=unitIndex;unitMenu()}else tileMenu()}dirty=true}}pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0});C.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));C.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(3,scale*(e.deltaY>0?.88:1.12)));dirty=true},{passive:false});
let minimapTick=0;function loop(t){let dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000||0));lastFrame=t;for(let u of game.units){if(!Array.isArray(u.path))u.path=[];let target=u.path.length?u.path[0]:{x:u.x,y:u.y};let dx=target.x-u.x,dy=target.y-u.y,len=Math.hypot(dx,dy);if(len<=.045&&u.path.length){u.x=target.x;u.y=target.y;u.path.shift();dirty=true}else if(len>.045){let step=Math.min(len,dt*(u.kind==='warrior'?2.3:1.5));u.x+=dx/len*step;u.y+=dy/len*step;dirty=true}}enemyTurn(dt);combatClock+=dt;if(combatClock>=1.2){combatClock=0;warriorAutoEngage();combatTurn()}for(let b of game.buildings){if(b.buildLeft>0){let nearby=game.units.filter(u=>u.kind==='worker'&&u.buildTarget===key(b.x,b.y)&&Math.hypot(u.x-(b.x+.5),u.y-(b.y+.5))<2.7&&(!u.path||!u.path.length)).length;let speed=nearby?Math.min(nearby,3)*1.15:.12;b.buildLeft=Math.max(0,b.buildLeft-dt*speed);dirty=true;if(!b.buildLeft){for(let u of game.units){if(u.buildTarget===key(b.x,b.y)){u.buildTarget=null;u.job=false;u.path=[]}}if(b.t==='Cabana')game.people+=2;assignWorkers();refresh();toast('🏗️ '+b.t+' concluída!')}}}live+=dt;autosave+=dt;dayClock+=dt;workerClock+=dt;if(dayClock>=25){dayClock-=25;nextDay()}if(workerClock>=8){workerClock=0;assignBuilders();assignWorkers()}if(live>=4){live=0;let gains={wood:0,food:0,stone:0,ore:0};for(let u of game.units.filter(u=>u.kind==='worker')){let x=Math.floor(u.x),y=Math.floor(u.y),b=biome(x,y);if(Math.hypot(u.tx-u.x,u.ty-u.y)>.15)continue;if(b===3)gains.wood+=2;else if(b===4){gains.stone+=1;gains.ore+=1}else if(b===1||b===2)gains.food+=2}for(let k of Object.keys(gains))game[k]+=gains[k];if(Object.values(gains).some(Boolean))refresh();}if(autosave>12){autosave=0;save()}draw();if(t-minimapTick>160){dirty=true;redrawMinimap();drawMinimap();minimapTick=t}requestAnimationFrame(loop)}if(game.enemy&&game.enemy.hp>0&&game.enemyUnits.length===0){spawnEnemyGuard();spawnEnemyGuard()}refresh();assignBuilders();assignWorkers();requestAnimationFrame(loop);if(!localStorage.getItem('cronicas-tutorial-v15'))showTutorial();else toast('v2.3: edifícios isométricos e combate tático!');
})();
</script></body></html>
