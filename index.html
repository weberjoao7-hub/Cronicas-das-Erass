<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102421"><title>Crônicas das Eras v1.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102421;color:#f5e9c7;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;right:0;min-height:68px;padding:calc(env(safe-area-inset-top) + 7px) 12px 9px;background:linear-gradient(#071714ed,#071714ac);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}header>*{pointer-events:auto}strong{font-size:15px}small{color:#c3d4bd;font-size:11px}.resources{text-align:right;line-height:1.5}button{border:1px solid #70977b;background:#234439;color:#fff3d5;border-radius:10px;padding:11px;min-height:43px;font-weight:600;cursor:pointer}button:active{background:#35674d}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:3}nav button{flex:1;max-width:135px;background:#16362bf5;padding:8px 4px;font-size:12px}#panel{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#102922f7;border:1px solid #67876c;border-radius:14px;padding:14px;display:none;z-index:3;max-height:55dvh;overflow:auto;box-shadow:0 10px 35px #0008}#panel.show{display:block}#panel h3{margin:0 0 8px}#panel button{margin:3px}#toast{position:fixed;left:50%;transform:translateX(-50%);top:95px;z-index:5;padding:10px 15px;border-radius:16px;background:#0c241ce8;opacity:0;pointer-events:none;max-width:85vw;text-align:center}#tip{position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:10px;color:#eee1bd;background:#0e2920b5;padding:6px 9px;border-radius:8px;font-size:11px;pointer-events:none}@media(min-width:750px){#panel{width:330px;left:auto;right:15px;bottom:82px}nav{left:50%;right:auto;transform:translateX(-50%);width:550px}}
#minimap{position:fixed;right:12px;top:84px;z-index:4;width:116px;height:116px;border:2px solid #aa9768;border-radius:9px;background:#1d342fdd;box-shadow:0 4px 18px #0007;touch-action:manipulation;cursor:pointer}#mapLabel{position:fixed;right:18px;top:204px;z-index:4;color:#f5e1ae;background:#16251edb;font-size:10px;padding:2px 5px;border-radius:6px;pointer-events:none}@media(max-width:410px){#minimap{width:95px;height:95px;top:91px}#mapLabel{top:190px}}</style></head><body><canvas id="world"></canvas><canvas id="minimap" width="160" height="160" aria-label="Minimapa interativo"></canvas><div id="mapLabel">Toque para navegar</div><header><div><strong>⚔️ CRÔNICAS DAS ERAS</strong><div><small id="era">Era Primordial · Dia 1</small></div></div><div class="resources" id="res"></div></header><div id="toast"></div><div id="tip">Arraste o mapa · pinça para zoom · Tropas → Mover</div><div id="panel"></div><nav><button id="home">🏠 Aldeia</button><button id="build">🔨 Construir</button><button id="army">⚔️ Tropas</button><button id="next">☀️ + Dia</button><button id="zoom">🔎 Zoom</button></nav>
<script>
(()=>{
"use strict";
const C=document.getElementById('world'),ctx=C.getContext('2d',{alpha:false}),res=document.getElementById('res'),panel=document.getElementById('panel'),eraLabel=document.getElementById('era');
const W=160,H=160,S=34;const M=document.getElementById("minimap"),mc=M.getContext("2d");
let dpr=1,w=0,h=0,scale=1,cx=80,cy=80,selected=null,dirty=true,dragged=false;
const eras=['Primordial','Tribal','Antiga','Clássica','Medieval','Renascença','Industrial','Contemporânea'];
const rnd=(x,y,z=0)=>{let n=Math.sin(x*127.1+y*311.7+z*78.233)*43758.5453;return n-Math.floor(n)};
const noise=(x,y,f)=>{let xx=x/f,yy=y/f,a=Math.floor(xx),b=Math.floor(yy),u=xx-a,v=yy-b;u=u*u*(3-2*u);v=v*v*(3-2*v);let l=(p,q)=>rnd(p,q);return (l(a,b)*(1-u)+l(a+1,b)*u)*(1-v)+(l(a,b+1)*(1-u)+l(a+1,b+1)*u)*v};
function biome(x,y){if(x<0||y<0||x>=W||y>=H)return 0;let n=noise(x,y,17)*.62+noise(x,y,6)*.38;const lake=noise(x+201,y-144,18);if(n<.28||lake<.20)return 0;if(n>.72)return 5;if(n>.64)return 4;if(n>.48)return 3;if(n>.37)return 2;return 1}
const colors=['#326784','#a4b36a','#7fba70','#2b7045','#8e8774','#6c6c6f'];
let game={day:1,era:0,wood:110,food:130,stone:80,ore:25,people:5,army:2,claim:['80,80'],buildings:[{x:80,y:80,t:'Aldeia'}],units:[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}],enemy:{x:91,y:86,hp:100}};
try{let old=JSON.parse(localStorage.getItem('cronicas-v04'));if(old&&Array.isArray(old.claim))game={...game,...old};if(!Array.isArray(game.units))game.units=[{x:80.4,y:80.4,tx:80.4,ty:80.4,kind:'worker'},{x:80.7,y:80.6,tx:80.7,ty:80.6,kind:'worker'},{x:80.3,y:80.75,tx:80.3,ty:80.75,kind:'warrior'}];if(!game.enemy)game.enemy={x:91,y:86,hp:100}}catch(e){}
function save(){try{localStorage.setItem('cronicas-v04',JSON.stringify(game))}catch(e){}}
const key=(x,y)=>x+','+y,claimed=()=>new Set(game.claim),at=(x,y)=>game.buildings.find(b=>b.x===x&&b.y===y);
function redrawMinimap(){let img=mc.createImageData(160,160),palette=[[42,104,132],[167,180,110],[123,167,95],[59,119,72],[142,137,113],[118,123,120]];for(let y=0;y<160;y++)for(let x=0;x<160;x++){const p=(y*160+x)*4,c=palette[biome(x,y)];img.data[p]=c[0];img.data[p+1]=c[1];img.data[p+2]=c[2];img.data[p+3]=255}mc.putImageData(img,0,0)}function drawMinimap(){mc.lineWidth=2;mc.strokeStyle="#ffe7ab";mc.strokeRect(Math.max(0,cx-6),Math.max(0,cy-6),12,12);mc.fillStyle="#ffe392";for(let b of game.buildings)mc.fillRect(b.x-1,b.y-1,3,3);if(game.enemy&&game.enemy.hp>0){mc.fillStyle="#e26c63";mc.fillRect(game.enemy.x-2,game.enemy.y-2,5,5)}}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;C.width=Math.floor(w*dpr);C.height=Math.floor(h*dpr);dirty=true}
addEventListener('resize',resize);resize();redrawMinimap();M.addEventListener('pointerdown',e=>{let r=M.getBoundingClientRect();cx=Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)/r.width*160)));cy=Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)/r.height*160)));dirty=true;toast('Câmera deslocada pelo minimapa')});
const TW=74,TH=38;
function point(x,y,z=0){return [w/2+((x-y)-(cx-cy))*TW*.5*scale,h*.47+((x+y)-(cx+cy))*TH*.5*scale-z*scale]}
function tileAt(px,py){let a=(px-w/2)/(TW*.5*scale)+(cx-cy),b=(py-h*.47)/(TH*.5*scale)+(cx+cy);return {x:Math.floor((a+b)/2),y:Math.floor((b-a)/2)}}
function diamond(x,y,ww,hh,fill,stroke){ctx.beginPath();ctx.moveTo(x,y-hh*.5);ctx.lineTo(x+ww*.5,y);ctx.lineTo(x,y+hh*.5);ctx.lineTo(x-ww*.5,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=Math.max(1,scale);ctx.stroke()}}
function tree(x,y,s,k){ctx.fillStyle='#142b2099';ctx.beginPath();ctx.ellipse(x+s*.12,y+s*.16,s*.66,s*.21,-.1,0,7);ctx.fill();ctx.fillStyle='#65442d';ctx.beginPath();ctx.moveTo(x-s*.095,y);ctx.lineTo(x-s*.065,y-s*.82);ctx.lineTo(x+s*.07,y-s*.82);ctx.lineTo(x+s*.11,y);ctx.fill();let cols=['#245b36','#327547','#3d8751','#478b52'];for(let i=0;i<4;i++){let cy=y-s*(.6+i*.24),r=s*(.52-i*.075);ctx.fillStyle=cols[(k+i)%cols.length];ctx.beginPath();ctx.moveTo(x,cy-r*1.4);ctx.lineTo(x-r,cy+r*.55);ctx.quadraticCurveTo(x,cy+r*.3,x+r,cy+r*.55);ctx.closePath();ctx.fill();ctx.strokeStyle='#193d2b55';ctx.lineWidth=Math.max(.6,s*.035);ctx.stroke()}ctx.fillStyle='#9ec47a66';ctx.beginPath();ctx.moveTo(x-s*.15,y-s*1.44);ctx.lineTo(x,y-s*1.61);ctx.lineTo(x+s*.12,y-s*1.3);ctx.closePath();ctx.fill()}
function rock(x,y,s){ctx.fillStyle='#27322b66';ctx.beginPath();ctx.ellipse(x+s*.1,y+s*.16,s*.87,s*.27,0,0,7);ctx.fill();ctx.fillStyle='#5d6763';ctx.beginPath();ctx.moveTo(x-s*.78,y+s*.14);ctx.lineTo(x-s*.26,y-s*.87);ctx.lineTo(x+s*.22,y-s*.78);ctx.lineTo(x+s*.8,y-s*.1);ctx.lineTo(x+s*.5,y+s*.27);ctx.closePath();ctx.fill();ctx.fillStyle='#a9ada4';ctx.beginPath();ctx.moveTo(x-s*.26,y-s*.87);ctx.lineTo(x+s*.22,y-s*.78);ctx.lineTo(x+s*.03,y-s*.22);ctx.lineTo(x-s*.48,y-s*.12);ctx.closePath();ctx.fill();ctx.fillStyle='#e1ddd044';ctx.beginPath();ctx.moveTo(x-s*.26,y-s*.87);ctx.lineTo(x-s*.05,y-s*.68);ctx.lineTo(x-s*.18,y-s*.43);ctx.closePath();ctx.fill()}
function house(x,y,s,kind){let ww=s*(kind==='Aldeia'?.86:.7),hh=s*.72;ctx.fillStyle='#11271d77';ctx.beginPath();ctx.ellipse(x,y+s*.28,ww*.75,s*.23,0,0,7);ctx.fill();ctx.fillStyle=kind==='Quartel'?'#aeb1a0':'#cab38a';ctx.fillRect(x-ww*.5,y-hh*.34,ww,hh*.68);ctx.fillStyle='#927353';ctx.fillRect(x-ww*.48,y+hh*.22,ww*.96,hh*.12);ctx.fillStyle=kind==='Quartel'?'#5b6772':'#6e4932';ctx.beginPath();ctx.moveTo(x-ww*.63,y-hh*.32);ctx.lineTo(x,y-hh*1.13);ctx.lineTo(x+ww*.63,y-hh*.32);ctx.closePath();ctx.fill();ctx.strokeStyle='#c19a65';ctx.lineWidth=Math.max(1,s*.036);for(let j=1;j<4;j++){ctx.beginPath();ctx.moveTo(x-ww*.58+j*ww*.29,y-hh*.38-j*hh*.16);ctx.lineTo(x+ww*.58-j*ww*.29,y-hh*.38-j*hh*.16);ctx.stroke()}ctx.fillStyle='#3d3026';ctx.fillRect(x-ww*.1,y+hh*.01,ww*.2,hh*.34);ctx.fillStyle='#8da6a6';ctx.fillRect(x-ww*.36,y-hh*.09,ww*.13,hh*.18);ctx.fillRect(x+ww*.23,y-hh*.09,ww*.13,hh*.18);if(kind==='Aldeia'||kind==='Quartel'){ctx.fillStyle='#c6a66e';ctx.fillRect(x+ww*.47,y-hh*1.3,s*.06,s*.73);ctx.fillStyle=kind==='Quartel'?'#a5bccc':'#cba85e';ctx.beginPath();ctx.moveTo(x+ww*.53,y-hh*1.28);ctx.lineTo(x+ww*.95,y-hh*1.13);ctx.lineTo(x+ww*.53,y-hh*.98);ctx.closePath();ctx.fill()}}
function draw(){if(!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#19362d';ctx.fillRect(0,0,w,h);let z=scale,ww=TW*z,hh=TH*z,rad=Math.min(24,Math.ceil(Math.max(w/ww,h/hh)*1.9)+3);let own=claimed();
for(let sum=Math.max(0,Math.floor(cx+cy)-rad*2);sum<Math.min((W+H-2),Math.ceil(cx+cy)+rad*2);sum++){let lo=Math.max(0,sum-(H-1),Math.floor(cx-rad)),hi=Math.min(W-1,sum,Math.ceil(cx+rad));for(let x=lo;x<=hi;x++){let y=sum-x;if(Math.abs(y-cy)>rad)continue;let [px,py]=point(x+.5,y+.5);if(px< -ww||px>w+ww||py< -hh*4||py>h+hh*4)continue;let b=biome(x,y),q=rnd(x,y,6);
let colors=['#286883','#9fad6a','#81a85f','#4c8550','#958d76','#878a88'];diamond(px,py,ww+1,hh+1,colors[b],null);
if(b===0){ctx.strokeStyle='#acd5de66';ctx.lineWidth=Math.max(1,z);ctx.beginPath();ctx.moveTo(px-ww*.20,py);ctx.quadraticCurveTo(px,py-hh*.15,px+ww*.21,py);ctx.stroke()}
if(b===3&&ww>11){let count=2+(q>.6?1:0);for(let i=0;i<count;i++)tree(px+(rnd(x+i,y,4)-.5)*ww*.48,py+(rnd(x,y+i,5)-.5)*hh*.43,ww*.29,i)}
if((b===4||b===5)&&ww>12){rock(px-ww*.09,py,ww*.28);if(b===5)rock(px+ww*.16,py+hh*.02,ww*.19)}
if(b===2&&q>.79&&ww>16){ctx.fillStyle='#f3bf55';for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(px+(rnd(x+j,y,3)-.5)*ww*.5,py+(rnd(x,y+j,3)-.5)*hh*.45,Math.max(1,z*1.8),0,7);ctx.fill()}}
if(own.has(key(x,y))){diamond(px,py,ww-1,hh-1,'#e7cf7520','#e5cd77')}
if(selected&&selected.x===x&&selected.y===y)diamond(px,py,ww-3,hh-3,null,'#fff4bd');
let obj=at(x,y);if(obj){if(obj.t==='Fazenda'){ctx.fillStyle='#9c793e';ctx.fillRect(px-ww*.20,py-hh*.12,ww*.4,hh*.48);ctx.strokeStyle='#ecd07a';for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(px-ww*.16+j*ww*.1,py-hh*.1);ctx.lineTo(px-ww*.16+j*ww*.1,py+hh*.31);ctx.stroke()}}else if(obj.t==='Mina'){rock(px,py,ww*.38);ctx.fillStyle='#282e2a';ctx.fillRect(px-ww*.08,py-hh*.05,ww*.16,hh*.3)}else house(px,py,ww*.7,obj.t)}
if(game.enemy&&game.enemy.hp>0&&game.enemy.x===x&&game.enemy.y===y){house(px,py,ww*.65,'Aldeia');ctx.fillStyle='#d65f55';ctx.fillRect(px-ww*.25,py-hh*1.4,ww*.5*game.enemy.hp/100,Math.max(2,z*3))}
for(const u of game.units){if(Math.floor(u.x)!==x||Math.floor(u.y)!==y)continue;let [ux,uy]=point(u.x,u.y);let size=Math.max(3,5.5*z);ctx.fillStyle='#20342b88';ctx.beginPath();ctx.ellipse(ux,uy+size*.65,size,size*.34,0,0,7);ctx.fill();ctx.fillStyle=u.kind==='worker'?'#cfa06d':'#acbacc';ctx.beginPath();ctx.arc(ux,uy-size*.65,size*.46,0,7);ctx.fill();ctx.fillStyle=u.kind==='worker'?'#a67b4a':'#647993';ctx.fillRect(ux-size*.4,uy-size*.22,size*.8,size*1.16);ctx.fillStyle='#3c352c';ctx.fillRect(ux-size*.32,uy+size*.95,size*.2,size*.5);ctx.fillRect(ux+size*.14,uy+size*.95,size*.2,size*.5);if(u.kind==='warrior'){ctx.strokeStyle='#cdd5d2';ctx.lineWidth=Math.max(1,z*1.5);ctx.beginPath();ctx.moveTo(ux+size*.45,uy);ctx.lineTo(ux+size*1.1,uy-size);ctx.stroke()}if(u===game.units[selectedUnit]){ctx.strokeStyle='#ffe8a2';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(ux,uy+size*.7,size*1.5,size*.56,0,0,7);ctx.stroke()}}

}}

}
function refresh(){eraLabel.textContent='Era '+eras[game.era]+' · Dia '+game.day;res.innerHTML='🪵 '+game.wood+' &nbsp; 🍎 '+game.food+'<br>🪨 '+game.stone+' &nbsp; ⛏️ '+game.ore+' &nbsp; 👥 '+game.people;dirty=true;save()}
let command=null,selectedUnit=0,live=0,lastFrame=0,autosave=0;let timer=0;function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(timer);timer=setTimeout(()=>el.style.opacity=0,2600)}
function menu(title,html){panel.classList.add('show');panel.innerHTML='<h3>'+title+'</h3>'+html+'<p><button id="close">Fechar</button></p>';document.getElementById('close').onclick=()=>panel.classList.remove('show')}
function spend(wood,food,stone,ore=0){if(game.wood<wood||game.food<food||game.stone<stone||game.ore<ore){toast('Recursos insuficientes');return false}game.wood-=wood;game.food-=food;game.stone-=stone;game.ore-=ore;return true}
const adjacent=(x,y)=>game.claim.some(s=>{let [a,b]=s.split(',').map(Number);return Math.abs(x-a)+Math.abs(y-b)===1});
function tileMenu(){if(!selected)return;let{x,y}=selected,b=biome(x,y),owned=game.claim.includes(key(x,y)),existing=at(x,y);menu('Região '+x+', '+y,'<p>Terreno: '+['Lago','Campina','Pradaria','Floresta','Colina','Montanha'][b]+'</p><p>'+(owned?'✅ Seu território':'Território não dominado')+(existing?' · '+existing.t:'')+'</p><button id="claim">🏳️ Dominar (🍎 12 🪵 5)</button>');document.getElementById('claim').onclick=()=>{if(owned)return toast('Já é seu território');if(b===0||b===5)return toast('Terreno impróprio para ocupação');if(!adjacent(x,y))return toast('Conquiste primeiro uma região vizinha');if(!spend(5,12,0))return;game.claim.push(key(x,y));refresh();tileMenu();toast('Território conquistado!')}}
function buildMenu(){menu('Construir na região selecionada','<p>Escolha uma região dominada e vazia.</p><button data-t="Cabana">🛖 Cabana · 🪵 35 🍎 15</button><button data-t="Fazenda">🌾 Fazenda · 🪵 30 🪨 15</button><button data-t="Mina">⛏️ Mina · 🪵 25 🪨 25</button><button data-t="Quartel">🏰 Quartel · 🪵 70 🪨 50</button>');panel.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{if(!selected)return toast('Selecione uma região');let{x,y}=selected;if(!game.claim.includes(key(x,y))||at(x,y))return toast('Escolha um terreno dominado e vazio');let t=el.dataset.t,price={Cabana:[35,15,0],Fazenda:[30,0,15],Mina:[25,0,25],Quartel:[70,0,50]}[t];if(!spend(...price))return;game.buildings.push({x,y,t});if(t==='Cabana')game.people+=2;refresh();toast(t+' construída!');buildMenu()})}
function armyMenu(){menu('Unidades e civilização','<p>🛡️ Guerreiros: '+game.army+' · População: '+game.people+'</p><p>Selecione uma unidade e toque no mapa para enviá-la até o destino. Trabalhadores coletam recursos automaticamente ao chegar.</p><button id="choose">👤 Alternar unidade ('+(selectedUnit+1)+'/'+game.units.length+')</button><button id="move">📍 Mover unidade</button><button id="train">⚔️ Treinar guerreiro (🍎 30 🪵 15)</button><button id="advance">🏛️ Evoluir era (🪵 160 🍎 160 🪨 100 ⛏️ 40)</button>');document.getElementById('choose').onclick=()=>{selectedUnit=(selectedUnit+1)%game.units.length;dirty=true;armyMenu()};document.getElementById('move').onclick=()=>{command='move';panel.classList.remove('show');toast('Toque no destino da unidade no mapa')};document.getElementById('train').onclick=()=>{if(!game.buildings.some(b=>b.t==='Quartel'))return toast('Construa um quartel');if(!spend(15,30,0))return;game.army++;game.units.push({x:80.5,y:80.5,tx:80.5,ty:80.5,kind:'warrior'});refresh();armyMenu()};document.getElementById('advance').onclick=()=>{if(game.era>=eras.length-1)return toast('Você chegou à era atual');if(!spend(160,160,100,40))return;game.era++;refresh();armyMenu();toast('Nova era: '+eras[game.era])}}
function nextDay(){game.day++;let farms=game.buildings.filter(x=>x.t==='Fazenda').length,mines=game.buildings.filter(x=>x.t==='Mina').length;game.food+=15+farms*15;game.wood+=12;game.stone+=4+mines*8;game.ore+=2+mines*4;refresh();toast('Dia '+game.day+' · recursos coletados')}
document.getElementById('home').onclick=()=>{cx=80;cy=80;scale=1.3;selected={x:80,y:80};dirty=true;tileMenu()};
document.getElementById('build').onclick=buildMenu;document.getElementById('army').onclick=armyMenu;document.getElementById('next').onclick=nextDay;document.getElementById('zoom').onclick=()=>{scale=scale>=2?0.65:scale+.35;dirty=true};
let pointers=new Map(),lastDist=0,down=null;
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){down={x:e.clientX,y:e.clientY};dragged=false}if(pointers.size===2)lastDist=0});
C.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);let dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragged=true;cx=Math.max(0,Math.min(W-1,cx-(dx/(TW*scale)+dy/(TH*scale))));cy=Math.max(0,Math.min(H-1,cy-(-dx/(TW*scale)+dy/(TH*scale))))}else{let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)scale=Math.max(.45,Math.min(3,scale*dist/lastDist));lastDist=dist;dragged=true}dirty=true});
C.addEventListener('pointerup',e=>{if(!dragged&&pointers.size===1&&down){let {x,y}=tileAt(e.clientX,e.clientY);if(x>=0&&x<W&&y>=0&&y<H){if(command==='move'){let u=game.units[selectedUnit];if(biome(x,y)===0||biome(x,y)===5){toast('Unidade não atravessa lagos ou montanhas')}else{u.tx=x+.5;u.ty=y+.5;toast('Unidade enviada ao destino');save()}command=null}else{selected={x,y};tileMenu()}dirty=true}}pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0});C.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));C.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(3,scale*(e.deltaY>0?.88:1.12)));dirty=true},{passive:false});
let minimapTick=0;function loop(t){let dt=Math.min(.05,Math.max(0,(t-lastFrame)/1000||0));lastFrame=t;for(let u of game.units){let dx=u.tx-u.x,dy=u.ty-u.y,len=Math.hypot(dx,dy);if(len>.035){let step=Math.min(len,dt*(u.kind==='warrior'?2.3:1.5));u.x+=dx/len*step;u.y+=dy/len*step;dirty=true}}live+=dt;autosave+=dt;if(live>=4){live=0;let gains={wood:0,food:0,stone:0,ore:0};for(let u of game.units.filter(u=>u.kind==='worker')){let x=Math.floor(u.x),y=Math.floor(u.y),b=biome(x,y);if(Math.hypot(u.tx-u.x,u.ty-u.y)>.15)continue;if(b===3)gains.wood+=2;else if(b===4){gains.stone+=1;gains.ore+=1}else if(b===1||b===2)gains.food+=2}for(let k of Object.keys(gains))game[k]+=gains[k];if(Object.values(gains).some(Boolean))refresh();if(game.enemy&&game.enemy.hp>0){let troops=game.units.filter(u=>u.kind==='warrior'&&Math.hypot(u.x-(game.enemy.x+.5),u.y-(game.enemy.y+.5))<1.2).length;if(troops){game.enemy.hp=Math.max(0,game.enemy.hp-troops*5);dirty=true;if(game.enemy.hp===0){game.claim.push(key(game.enemy.x,game.enemy.y));toast('Tribo rival derrotada! Território conquistado.');refresh()}}}}if(autosave>12){autosave=0;save()}draw();if(t-minimapTick>700){redrawMinimap();drawMinimap();minimapTick=t}requestAnimationFrame(loop)}refresh();requestAnimationFrame(loop);toast('Versão 1.0: árvores, montanhas e arquitetura aprimoradas!');
})();
</script></body></html>
