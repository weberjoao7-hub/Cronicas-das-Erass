<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#102421"><title>Crônicas das Eras</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102421;color:#f5e9c7;font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:0;left:0;right:0;min-height:68px;padding:calc(env(safe-area-inset-top) + 7px) 12px 9px;background:linear-gradient(#071714ed,#071714ac);display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2;pointer-events:none}header>*{pointer-events:auto}strong{font-size:15px}small{color:#c3d4bd;font-size:11px}.resources{text-align:right;line-height:1.5}button{border:1px solid #70977b;background:#234439;color:#fff3d5;border-radius:10px;padding:11px;min-height:43px;font-weight:600;cursor:pointer}button:active{background:#35674d}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:3}nav button{flex:1;max-width:135px;background:#16362bf5;padding:8px 4px;font-size:12px}#panel{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));background:#102922f7;border:1px solid #67876c;border-radius:14px;padding:14px;display:none;z-index:3;max-height:55dvh;overflow:auto;box-shadow:0 10px 35px #0008}#panel.show{display:block}#panel h3{margin:0 0 8px}#panel button{margin:3px}#toast{position:fixed;left:50%;transform:translateX(-50%);top:95px;z-index:5;padding:10px 15px;border-radius:16px;background:#0c241ce8;opacity:0;pointer-events:none;max-width:85vw;text-align:center}#tip{position:fixed;bottom:calc(65px + env(safe-area-inset-bottom));left:10px;color:#eee1bd;background:#0e2920b5;padding:6px 9px;border-radius:8px;font-size:11px;pointer-events:none}@media(min-width:750px){#panel{width:330px;left:auto;right:15px;bottom:82px}nav{left:50%;right:auto;transform:translateX(-50%);width:550px}}
</style></head><body><canvas id="world"></canvas><header><div><strong>⚔️ CRÔNICAS DAS ERAS</strong><div><small id="era">Era Primordial · Dia 1</small></div></div><div class="resources" id="res"></div></header><div id="toast"></div><div id="tip">Arraste para explorar · toque para selecionar · pinça para zoom</div><div id="panel"></div><nav><button id="home">🏠 Aldeia</button><button id="build">🔨 Construir</button><button id="army">⚔️ Tropas</button><button id="next">☀️ + Dia</button><button id="zoom">🔎 Zoom</button></nav>
<script>
(()=>{
"use strict";
const C=document.getElementById('world'),ctx=C.getContext('2d',{alpha:false}),res=document.getElementById('res'),panel=document.getElementById('panel'),eraLabel=document.getElementById('era');
const W=160,H=160,S=34;
let dpr=1,w=0,h=0,scale=1,cx=80,cy=80,selected=null,dirty=true,dragged=false;
const eras=['Primordial','Tribal','Antiga','Clássica','Medieval','Renascença','Industrial','Contemporânea'];
const rnd=(x,y,z=0)=>{let n=Math.sin(x*127.1+y*311.7+z*78.233)*43758.5453;return n-Math.floor(n)};
const noise=(x,y,f)=>{let xx=x/f,yy=y/f,a=Math.floor(xx),b=Math.floor(yy),u=xx-a,v=yy-b;u=u*u*(3-2*u);v=v*v*(3-2*v);let l=(p,q)=>rnd(p,q);return (l(a,b)*(1-u)+l(a+1,b)*u)*(1-v)+(l(a,b+1)*(1-u)+l(a+1,b+1)*u)*v};
function biome(x,y){if(x<0||y<0||x>=W||y>=H)return 0;let n=noise(x,y,17)*.62+noise(x,y,6)*.38;const lake=noise(x+201,y-144,18);if(n<.28||lake<.20)return 0;if(n>.72)return 5;if(n>.64)return 4;if(n>.48)return 3;if(n>.37)return 2;return 1}
const colors=['#326784','#a4b36a','#7fba70','#2b7045','#8e8774','#6c6c6f'];
let game={day:1,era:0,wood:110,food:130,stone:80,ore:25,people:5,army:2,claim:['80,80'],buildings:[{x:80,y:80,t:'Aldeia'}]};
try{let old=JSON.parse(localStorage.getItem('cronicas-v04'));if(old&&Array.isArray(old.claim))game={...game,...old}}catch(e){}
function save(){try{localStorage.setItem('cronicas-v04',JSON.stringify(game))}catch(e){}}
const key=(x,y)=>x+','+y,claimed=()=>new Set(game.claim),at=(x,y)=>game.buildings.find(b=>b.x===x&&b.y===y);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;C.width=Math.floor(w*dpr);C.height=Math.floor(h*dpr);dirty=true}
addEventListener('resize',resize);resize();
function draw(){if(!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#122a29';ctx.fillRect(0,0,w,h);let ts=S*scale,ox=w/2-cx*ts,oy=h/2-cy*ts;
let x0=Math.max(0,Math.floor(-ox/ts)-1),x1=Math.min(W,Math.ceil((w-ox)/ts)+1),y0=Math.max(0,Math.floor(-oy/ts)-1),y1=Math.min(H,Math.ceil((h-oy)/ts)+1),own=claimed();
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){let xx=ox+x*ts,yy=oy+y*ts,b=biome(x,y);ctx.fillStyle=colors[b];ctx.fillRect(xx,yy,ts+1,ts+1);if(ts>15){const q=rnd(x,y,6);if(b===3){ctx.fillStyle='#194e2f';ctx.beginPath();ctx.arc(xx+ts*.48,yy+ts*.44,ts*.25,0,7);ctx.fill();ctx.fillStyle='#347747';ctx.beginPath();ctx.arc(xx+ts*.55,yy+ts*.34,ts*.19,0,7);ctx.fill()}if(b===4||b===5){ctx.fillStyle='#c4bdad';ctx.beginPath();ctx.moveTo(xx+ts*.12,yy+ts*.84);ctx.lineTo(xx+ts*.48,yy+ts*.16);ctx.lineTo(xx+ts*.86,yy+ts*.84);ctx.fill()}if(b===2&&q>.74){ctx.fillStyle='#e2a44c';ctx.beginPath();ctx.arc(xx+ts*.58,yy+ts*.6,Math.max(2,ts*.09),0,7);ctx.fill()}if(b===0){ctx.strokeStyle='#86b4bc55';ctx.beginPath();ctx.moveTo(xx+ts*.1,yy+ts*.5);ctx.lineTo(xx+ts*.55,yy+ts*.45);ctx.stroke()}}
if(own.has(key(x,y))){ctx.fillStyle='#e8d46a24';ctx.fillRect(xx,yy,ts,ts);ctx.strokeStyle='#efce61';ctx.lineWidth=Math.max(1,ts*.045);ctx.strokeRect(xx+1,yy+1,ts-2,ts-2)}
if(ts>20){ctx.strokeStyle='#ffffff0b';ctx.lineWidth=.5;ctx.strokeRect(xx,yy,ts,ts)}}
for(let b of game.buildings){let xx=ox+(b.x+.5)*ts,yy=oy+(b.y+.5)*ts;if(xx< -ts||xx>w+ts||yy< -ts||yy>h+ts)continue;ctx.font=Math.max(12,Math.min(38,ts*.82))+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({'Aldeia':'🏕️','Cabana':'🛖','Fazenda':'🌾','Mina':'⛏️','Quartel':'🏰'}[b.t]||'🏠',xx,yy)}
if(selected){let xx=ox+selected.x*ts,yy=oy+selected.y*ts;ctx.strokeStyle='#fff6b0';ctx.lineWidth=3;ctx.strokeRect(xx+2,yy+2,ts-4,ts-4)}
requestAnimationFrame(()=>{});}
function refresh(){eraLabel.textContent='Era '+eras[game.era]+' · Dia '+game.day;res.innerHTML='🪵 '+game.wood+' &nbsp; 🍎 '+game.food+'<br>🪨 '+game.stone+' &nbsp; ⛏️ '+game.ore+' &nbsp; 👥 '+game.people;dirty=true;save()}
let timer=0;function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(timer);timer=setTimeout(()=>el.style.opacity=0,2600)}
function menu(title,html){panel.classList.add('show');panel.innerHTML='<h3>'+title+'</h3>'+html+'<p><button id="close">Fechar</button></p>';document.getElementById('close').onclick=()=>panel.classList.remove('show')}
function spend(wood,food,stone,ore=0){if(game.wood<wood||game.food<food||game.stone<stone||game.ore<ore){toast('Recursos insuficientes');return false}game.wood-=wood;game.food-=food;game.stone-=stone;game.ore-=ore;return true}
const adjacent=(x,y)=>game.claim.some(s=>{let [a,b]=s.split(',').map(Number);return Math.abs(x-a)+Math.abs(y-b)===1});
function tileMenu(){if(!selected)return;let{x,y}=selected,b=biome(x,y),owned=game.claim.includes(key(x,y)),existing=at(x,y);menu('Região '+x+', '+y,'<p>Terreno: '+['Lago','Campina','Pradaria','Floresta','Colina','Montanha'][b]+'</p><p>'+(owned?'✅ Seu território':'Território não dominado')+(existing?' · '+existing.t:'')+'</p><button id="claim">🏳️ Dominar (🍎 12 🪵 5)</button>');document.getElementById('claim').onclick=()=>{if(owned)return toast('Já é seu território');if(b===0||b===5)return toast('Terreno impróprio para ocupação');if(!adjacent(x,y))return toast('Conquiste primeiro uma região vizinha');if(!spend(5,12,0))return;game.claim.push(key(x,y));refresh();tileMenu();toast('Território conquistado!')}}
function buildMenu(){menu('Construir na região selecionada','<p>Escolha uma região dominada e vazia.</p><button data-t="Cabana">🛖 Cabana · 🪵 35 🍎 15</button><button data-t="Fazenda">🌾 Fazenda · 🪵 30 🪨 15</button><button data-t="Mina">⛏️ Mina · 🪵 25 🪨 25</button><button data-t="Quartel">🏰 Quartel · 🪵 70 🪨 50</button>');panel.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{if(!selected)return toast('Selecione uma região');let{x,y}=selected;if(!game.claim.includes(key(x,y))||at(x,y))return toast('Escolha um terreno dominado e vazio');let t=el.dataset.t,price={Cabana:[35,15,0],Fazenda:[30,0,15],Mina:[25,0,25],Quartel:[70,0,50]}[t];if(!spend(...price))return;game.buildings.push({x,y,t});if(t==='Cabana')game.people+=2;refresh();toast(t+' construída!');buildMenu()})}
function armyMenu(){menu('Tropas e civilização','<p>🛡️ Guerreiros: '+game.army+' · População: '+game.people+'</p><button id="train">⚔️ Treinar guerreiro (🍎 30 🪵 15)</button><button id="advance">🏛️ Evoluir era (🪵 160 🍎 160 🪨 100 ⛏️ 40)</button>');document.getElementById('train').onclick=()=>{if(!game.buildings.some(b=>b.t==='Quartel'))return toast('Construa um quartel');if(!spend(15,30,0))return;game.army++;refresh();armyMenu()};document.getElementById('advance').onclick=()=>{if(game.era>=eras.length-1)return toast('Você chegou à era atual');if(!spend(160,160,100,40))return;game.era++;refresh();armyMenu();toast('Nova era: '+eras[game.era])}}
function nextDay(){game.day++;let farms=game.buildings.filter(x=>x.t==='Fazenda').length,mines=game.buildings.filter(x=>x.t==='Mina').length;game.food+=15+farms*15;game.wood+=12;game.stone+=4+mines*8;game.ore+=2+mines*4;refresh();toast('Dia '+game.day+' · recursos coletados')}
document.getElementById('home').onclick=()=>{cx=80;cy=80;scale=1.3;selected={x:80,y:80};dirty=true;tileMenu()};
document.getElementById('build').onclick=buildMenu;document.getElementById('army').onclick=armyMenu;document.getElementById('next').onclick=nextDay;document.getElementById('zoom').onclick=()=>{scale=scale>=2?0.65:scale+.35;dirty=true};
let pointers=new Map(),lastDist=0,down=null;
C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){down={x:e.clientX,y:e.clientY};dragged=false}if(pointers.size===2)lastDist=0});
C.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId);let dx=e.clientX-p.x,dy=e.clientY-p.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragged=true;cx=Math.max(0,Math.min(W-1,cx-dx/(S*scale)));cy=Math.max(0,Math.min(H-1,cy-dy/(S*scale)))}else{let a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)scale=Math.max(.45,Math.min(3,scale*dist/lastDist));lastDist=dist;dragged=true}dirty=true});
C.addEventListener('pointerup',e=>{if(!dragged&&pointers.size===1&&down){let x=Math.floor(cx+(e.clientX-w/2)/(S*scale)),y=Math.floor(cy+(e.clientY-h/2)/(S*scale));if(x>=0&&x<W&&y>=0&&y<H){selected={x,y};tileMenu();dirty=true}}pointers.delete(e.pointerId);if(pointers.size<2)lastDist=0});C.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));C.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(3,scale*(e.deltaY>0?.88:1.12)));dirty=true},{passive:false});
function loop(){draw();requestAnimationFrame(loop)}refresh();loop();toast('Bem-vindo! Toque no mapa e conquiste regiões.');
})();
</script></body></html>
