name: Validar jogo RTS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-worker-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar sintaxe, salvamento e aldeões
        run: node --test tests/*.test.cjs
