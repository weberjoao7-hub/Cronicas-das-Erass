name: Validate browser JavaScript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: [self-hosted, linux, x64, aquapilot]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const os = require('node:os');
          const path = require('node:path');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs))
            .filter(([, attrs]) => !/\btype\s*=\s*["'](?:application\/json|application\/ld\+json|importmap)["']/.test(attrs));
          if (!scripts.length) throw new Error('No inline scripts found in index.html');
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'rts-syntax-'));
          try {
            for (let i = 0; i < scripts.length; i++) {
              const [, attrs, source] = scripts[i];
              const file = path.join(dir, 'script-' + i + (/\btype\s*=\s*["']module["']/.test(attrs) ? '.mjs' : '.js'));
              fs.writeFileSync(file, source);
              cp.execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
            }
            console.log('Validated ' + scripts.length + ' inline script(s).');
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
          NODE

      - name: Validate RTS document and mobile controls
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          assert.equal(new Set(ids).size, ids.length, 'Duplicate HTML id');
          for (const id of ['world','minimap','panel','home','build','army','help','zoom','cancelPlacement','res']) {
            assert.ok(ids.includes(id), 'Missing essential game control: '+id);
          }
          assert.match(html, /viewport-fit=cover/, 'Missing iPhone safe-area viewport');
          assert.match(html, /touch-action\s*:\s*none/, 'Missing touch gesture support');
          assert.match(html, /prefers-reduced-motion/, 'Missing reduced motion support');
          assert.match(html, /ResizeObserver/, 'Missing dynamic canvas resize handling');
          assert.match(html, /const W=160,H=160/, 'Map dimensions changed: review smoke assumptions');
          console.log('RTS HTML and mobile control smoke checks passed.');
          NODE
